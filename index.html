// 짧은 알림 팝업: 스크롤 위치와 상관없이 바로 보이게
let toastTimer = null;
function toast(text, ok) {
  const el = document.getElementById("toast");
  el.textContent = text;
  el.className = "toast " + (ok ? "ok" : "bad");
  el.hidden = false;
  void el.offsetWidth; el.classList.add("show");          // 다시 나타나는 효과
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.classList.remove("show"); setTimeout(() => { el.hidden = true; }, 250); }, 2600);
}

// ───────── 게임 중 물건 줍기 ─────────
// 장면의 loot: [{ id, from(어디서), loc(이 장소에서만) }]. 고르는 선택지와 별개라 장면이 끝나지 않음
const lootKey = (s, id) => s.stage + "|" + id;
function lootFor(s) { return (s.loot || []).filter(l => !l.loc || l.loc === startLoc); }
function lootHtml(s) {
  const list = lootFor(s);
  if (!list.length) return "";
  const isDone = l => lootTaken.has(lootKey(s, l.id)) || has(l.id);
  // 다 챙겼으면 상자 전체를 초록 '다 챙겼어요'로
  if (list.every(isDone)) {
    return `<div class="loot-box done"><p class="label">✓ 다 챙겼어요 <span class="note">${list.map(l => ITEM_BY_ID[l.id].emo).join(" ")} 가방에 있어요</span></p></div>`;
  }
  return `<div class="loot-box">
    <p class="label"><span class="ic ic-search"></span>쓸 만한 물건이 보인다! <span class="note">${list[0].from}</span></p>
    <div class="loot-list">
      ${list.map(l => isDone(l)
        ? `<span class="loot-item done">${nameOf(l.id)} <strong>✓ 가방에 넣었어요</strong></span>`
        : `<button class="loot-item" data-loot="${l.id}">${nameOf(l.id)} <strong>＋ 챙기기</strong></button>`).join("")}
    </div>
  </div>`;
}
// 체력이 낮고 먹을 게 있으면 체력 바 바로 아래에 '먹기' 버튼
function bestFood() {
  return [...placed.map(p => p.id), ...pocket].filter(id => ITEM_BY_ID[id].heal && uses[id] > 0)
    .sort((a, b) => ITEM_BY_ID[b].heal - ITEM_BY_ID[a].heal)[0] || null;
}
const LOW_HP = 30;   // 이 밑으로 내려가면 '체력 낮아요'
function healMiniHtml() {
  if (hp >= LOW_HP || hp <= 0) return "";
  const food = bestFood();
  if (!food) return `<span class="heal-mini none">체력 낮아요</span>`;
  return `<button class="heal-mini" id="quick-heal" type="button" title="${nameOf(food)} 먹기">체력 낮아요 · ${ITEM_BY_ID[food].emo} 먹기 +${ITEM_BY_ID[food].heal}</button>`;
}
function quickHeal() {
  const food = bestFood();
  if (!food) return;
  consume(food);
  hp = clampHp(hp + ITEM_BY_ID[food].heal);
  toast(`${jo(nameOf(food), "을", "를")} 먹었다. 기운이 난다. ❤️ +${ITEM_BY_ID[food].heal}`, true);
  const m = document.getElementById("feed-meters"); if (m) m.innerHTML = metersHtml("scene");
  const live = document.getElementById("live");
  if (live && live.querySelector(".options")) rerender(() => renderScene(Number(live.dataset.idx)));
}
document.addEventListener("click", e => { if (e.target.closest("#quick-heal")) quickHeal(); });
function takeLoot(index, id) {
  const s = scenes[index], it = ITEM_BY_ID[id];
  const msg = addItem(id);
  if (msg) { pickerOpen = true; dropMode = true; pendingUse = null; toast(`${msg} 아래 가방에서 버릴 물건을 골라 자리를 만든 뒤 다시 챙겨 보세요.`, false); }
  else {
    dropMode = false;   // 자리가 생겨 챙겼으면 버리기 모드는 끝 (안 끄면 다음에 누른 물건이 버려짐)
    if (it.uses) uses[id] = it.uses;
    lootTaken.add(lootKey(s, id));
    toast(`${jo(nameOf(id), "을", "를")} 가방에 챙겼다.`, true);
  }
  rerender(() => renderScene(index));
}

// 🎒 쓴 물건 기록 (장면 위 '내 물건'에서 보여 줌). 다시 고르기로 앞 장면에 가면 그 뒤 기록은 지움
let usedLog = [], invOpen = false;
function logUse(id, index) { usedLog.push({ id, idx: index, st: scenes[index] ? scenes[index].stage : "" }); }
function invHtml(index) {
  usedLog = usedLog.filter(u => u.idx <= index);
  const own = {};
  [...placed.map(p => p.id), ...pocket].forEach(id => { const n = nameOf(id); own[n] = (own[n] || 0) + (ITEM_BY_ID[id].uses > 1 ? uses[id] || 1 : 1); });
  const ownList = Object.entries(own);
  return `<details class="inv-sum" id="inv-sum"${invOpen ? " open" : ""}><summary>🎒 내 물건 <small>가진 것 ${ownList.length} · 쓴 것 ${usedLog.length}</small></summary>
    <p class="inv-h">가진 것</p>${ownList.length ? `<div class="inv-chips">${ownList.map(([n, c]) => `<span class="inv-chip">${n}${c > 1 ? ` <b>×${c}</b>` : ""}</span>`).join("")}</div>` : `<p class="note">가방이 비어 있다</p>`}
    <p class="inv-h">쓴 것</p>${usedLog.length ? `<div class="inv-chips">${usedLog.map(u => `<span class="inv-chip used">${nameOf(u.id)} <small>${u.st.split(" · ")[0]}</small></span>`).join("")}</div>` : `<p class="note">아직 쓴 물건이 없다</p>`}
  </details>`;
}
function consume(id) {
  // 여러 병짜리(perCell)는 한 병 쓰면 칸도 하나 줄어듦
  const it = ITEM_BY_ID[id], p = placed.find(q => q.id === id);
  if (it.perCell && p && uses[id] > 1) { if (p.h > 1) p.h -= 1; else if (p.w > 1) p.w -= 1; }
  if (!ITEM_BY_ID[id].uses) return;
  uses[id] -= 1;
  if (uses[id] <= 0) { placed = placed.filter(p => p.id !== id); pocket = pocket.filter(x => x !== id); }
}

function useItem(index, id) {
  if (pendingUse !== id) {   // 잘못 눌러 바로 먹지 않게: 한 번 더 눌러야 씀
    pendingUse = id;
    toast(dropMode ? `${jo(nameOf(id), "을", "를")} 버릴까요? 한 번 더 누르면 버려요.` : `${jo(nameOf(id), "을", "를")} 쓸까요? 한 번 더 누르면 써요.`, true);
    rerender(() => renderScene(index)); return;
  }
  pendingUse = null;
  if (dropMode) {
    placed = placed.filter(p => p.id !== id); pocket = pocket.filter(x => x !== id); delete uses[id];
    toast(`🗑 ${jo(nameOf(id), "을", "를")} 버렸어요. 자리가 생겼어요.`, true);
    rerender(() => renderScene(index)); return;
  }
  const s = scenes[index], it = ITEM_BY_ID[id];
  const hit = s.items[id] || (it.cat && s.items[it.cat]);
  if (hit) {
    logUse(id, index); consume(id);
    resolve(index, { label: `🎒 ${nameOf(id)} 사용`, ...hit, hp: (hit.hp || 0) + (it.heal && it.uses ? it.heal : 0), fromItem: true });
    return;
  }
  if (it.heal) {
    logUse(id, index); consume(id);
    hp = clampHp(hp + it.heal);
    toast(`${nameOf(id)}: 먹고 나니 기운이 난다. ❤️ +${it.heal}`, true);
  } else if (!Object.keys(s.items).length) {   // 물건으로 푸는 장면이 아니면 감점 없이 안내만
    toast(`${jo(nameOf(id), "은", "는")} 지금은 쓸 데가 없다. 선택지 중에서 골라 보자.`, false);
  } else if (tried.includes(id)) {      // 같은 물건을 또 눌러도 감점은 한 번만
    toast(`${jo(nameOf(id), "은", "는")} 아까 꺼내 봤지만 소용없었다. 💡 ${jo(s.itemHint || "다른 물건", "이", "가")} 필요해.`, false);
  } else {
    tried.push(id); penalty += 2;
    // 넘어가지 않고, 무엇이 필요한지 다시 알려 줌
    toast(`${jo(nameOf(id), "을", "를")} 꺼내 봤지만… 지금은 안 맞는 것 같다. 💡 ${jo(s.itemHint || "다른 물건", "이", "가")} 필요해. 다른 물건이나 선택지를 골라 보자.`, false);
  }
  rerender(() => renderScene(index));
}

// ───────── 🎮 미니게임 · ⏱ 시간 제한 ─────────
// 화면에서만 동작 (자동 플레이 테스트는 applyChoice만 써서 영향 없음)
let miniLog = {};            // 장면 번호 → 미니게임 결과 한 줄 (피드백에 표시)
let miniStop = null;         // 진행 중인 미니게임 정리 함수
let urgentDeadline = 0, urgentTimer = null, urgentIndex = -1;
// 빠르게 눌러야 하는 버튼용: 손가락이 닿는 순간 바로 실행. click은 손가락이 조금만 밀려도 안 생겨서 "눌렀는데 반응이 없다"가 됨
// (키보드로 누른 click은 그대로 받고, 방금 손가락으로 누른 뒤 따라오는 click은 무시)
function onTap(el, fn) {
  let last = 0;
  el.addEventListener("pointerdown", e => { if (e.button > 0 || el.disabled) return; last = performance.now(); fn(e); });
  el.addEventListener("click", e => { if (performance.now() - last < 700) return; fn(e); });
}
function stopMini() { if (miniStop) { miniStop(); miniStop = null; } closeMiniLayer(); }
function miniLayer() {
  let L = document.getElementById("mini-layer");
  if (!L) { L = document.createElement("div"); L.id = "mini-layer"; L.className = "mini-layer"; L.innerHTML = '<div class="wrap" id="mini-wrap"></div>'; document.body.appendChild(L); }
  document.body.classList.add("mini-open");
  return document.getElementById("mini-wrap");
}
function closeMiniLayer() { const L = document.getElementById("mini-layer"); if (L) L.remove(); document.body.classList.remove("mini-open"); }
function stopUrgent() { clearInterval(urgentTimer); urgentTimer = null; urgentDeadline = 0; urgentIndex = -1; }
// 전화·알림·화면 잠금으로 화면이 가려졌다 돌아오면, 가려진 시간만큼 마감을 미룸 (돌아오자마자 '시간 초과'가 되지 않게)
let hiddenAt = 0;
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  if (hiddenAt && urgentDeadline) urgentDeadline += Date.now() - hiddenAt;
  hiddenAt = 0;
});

// 급한 장면: 몇 초 안에 고르지 않으면 얼어붙음 (가장 낮은 점수 선택지로 처리 + 체력 −5)
function urgentSecOf(s) { return s.urgent || (s.actions.some(a => a.achv === "cpr") ? 10 : 0); }
function urgentHtml() {
  if (!urgentDeadline) return "";
  const left = Math.max(0, (urgentDeadline - Date.now()) / 1000);
  return `<div class="urgent"><span>⏱ <b id="urgent-left">${Math.ceil(left)}</b>초 안에 골라요!</span><div class="track"><i id="urgent-fill" style="width:${left / urgentTotal * 100}%"></i></div></div>`;
}
let urgentTotal = 10;
function startUrgent(index) {
  const sec = urgentSecOf(scenes[index]);
  if (!sec) return;
  clearInterval(urgentTimer);   // 두 번 불려도 앞의 타이머가 남지 않게
  urgentTotal = sec; urgentIndex = index; urgentDeadline = Date.now() + sec * 1000;
  urgentTimer = setInterval(() => {
    if (document.hidden || hiddenAt) return;   // 화면이 가려진 동안은 시간이 흐르지 않음
    const left = (urgentDeadline - Date.now()) / 1000;
    const n = document.getElementById("urgent-left"), f = document.getElementById("urgent-fill");
    if (n) n.textContent = Math.max(0, Math.ceil(left));
    if (f) f.style.width = Math.max(0, left / urgentTotal * 100) + "%";
    if (left <= 3 && left > 0 && Math.abs(left - Math.round(left)) < 0.11) Sound.beep();
    if (left <= 0) { const i = urgentIndex; stopUrgent(); resolve(i, frozenChoice(scenes[i])); }
  }, 100);
}
function frozenChoice(s) {
  const a = s.actions.filter(x => !x.need).sort((x, y) => x.p - y.p)[0];
  return { ...a, label: "⏱ 시간 초과 · " + a.t, p: 0, hp: (a.hp || 0) - 5, timeout: true,
    r: "머리가 하얘져 우물쭈물하다 시간을 놓쳤다. " + (a.r || "") };
}

// 공통 틀: 소개 → 게임 → 결과 → 계속
// 미니게임 소개 (제목·그림·상황·방법·주황 시작 버튼)
function miniIntroInner(kind, ev, btnId) {
  const G = MINI[kind];
  return `<p class="mini-tag"><span class="ic ic-game"></span>미니게임 · ${G.title}</p>
      ${MINI_IMG[kind] ? `<img class="mini-art" src="${MINI_IMG[kind]}" alt="">` : ""}
      <p class="story">${(ev && ev.text) || G.intro}</p>
      <p class="mini-how">${G.how()}</p>
      ${hardMode ? `<p class="hard-note">🔥 하드 모드: 시간은 짧고, 실수는 거의 봐주지 않아요</p>` : ""}
      <button class="nav-primary highlight mini-start" id="${btnId}"><span class="ic ic-play"></span>시작하기</button>`;
}
// 덮는 창에서 바로 플레이 (소개 없이)
function playMini(kind, done) {
  stopMini();
  miniLayer().innerHTML = `${metersHtml("scene")}<div class="mini" id="mini"></div>`;
  document.getElementById("mini-layer").scrollTop = 0;
  setNav({ game: true, back: true });
  let over = false;   // 결과는 한 번만
  // 3·2·1 뒤에 시작 (보통·하드 모두). 세는 도중에 나가면 miniStop이 셈을 멈춤
  miniStop = countDown(MINI[kind].title, () => { miniStop = null; MINI[kind].play(document.getElementById("mini"), res => { if (over) return; over = true; if (miniStop) { miniStop(); miniStop = null; } if (res.ok && !testMode) { const m = loadJson(MINI_KEY, []), k = kind + ":" + (hardMode ? "h" : "n"); if (!m.includes(k)) saveJson(MINI_KEY, [...m, k]); } showMiniResult(res, done); }); });
}
// 화면을 덮고 3·2·1을 센 뒤 done을 부름. 돌려주는 함수를 부르면 세기를 그만둠
function countDown(label, done) {
  const ov = document.createElement("div");
  ov.className = "count-ov";
  document.body.appendChild(ov);
  let n = 3;
  const show = () => { ov.innerHTML = `<span>${n}</span><small>${label}</small>`; Sound.beep(0.5, 660); };
  show();
  const id = setInterval(() => {
    n -= 1;
    if (n > 0) { show(); return; }
    clearInterval(id); ov.remove();
    Sound.beep(0.8, 990);
    done();
  }, 800);
  return () => { clearInterval(id); ov.remove(); };
}
// 덮는 창에 소개 → 시작 (테스트 도구 등 흐름 밖에서)
function runMini(kind, ev, done) {
  stopMini();
  miniLayer().innerHTML = `${metersHtml("scene")}<div class="mini" id="mini">${miniIntroInner(kind, ev, "mini-start")}</div>`;
  setNav({ game: true, back: true });
  document.getElementById("mini-start").addEventListener("click", () => playMini(kind, done));
  document.getElementById("mini-layer").scrollTop = 0;
}
// 웹툰 흐름 안에 소개를 붙임 → '시작하기'를 누르면 바로 플레이, 끝나면 소개 자리에 결과 한 줄
function miniInline(parent, kind, ev, done, idx) {
  const box = document.createElement("div");
  box.className = "mini mini-intro"; box.dataset.miniIdx = idx;
  box.innerHTML = miniIntroInner(kind, ev, "mini-go-" + idx);
  parent.appendChild(box);
  reveal(box);
  let finished = false;
  box.querySelector("button").addEventListener("click", e => { e.currentTarget.disabled = true; e.currentTarget.blur(); playMini(kind, res => {
    if (finished) return; finished = true;
    box.innerHTML = `<p class="mini-tag"><span class="ic ic-game"></span>${MINI[kind].title}</p><p class="note">${res.log || ""}</p>`;
    done(res);
  }); }, { once: true });
  return box;
}
function showMiniResult(res, done) {
  const resHtml = `
    <div class="mini mini-res mini-res-inline" id="mini-res">
      <p class="mini-tag"><span class="ic ic-game"></span>결과</p>
      <p class="mini-big ${res.ok ? "good" : res.mid ? "mid" : "bad"}">${res.ok ? "성공!" : res.mid ? "아쉬워요" : "실패…"} <span>${res.big}</span></p>
      <p>${res.text}</p>
      <p class="delta ${res.hp < 0 ? "down" : "up"}">${res.hp ? `❤️ 체력 ${res.hp > 0 ? "+" : ""}${res.hp}` : "❤️ 체력 그대로"}</p>
      ${res.tip ? `<details class="mini-tip"><summary>설명 보기</summary><p class="tip">${res.tip}</p></details>` : ""}
      <button class="nav-primary highlight mini-start" id="mini-continue">계속 →</button>
    </div>`;
  const game = document.getElementById("mini");
  if (game) { game.classList.add("mini-ended"); game.insertAdjacentHTML("afterend", resHtml); }   // 게임 화면은 그대로 두고 아래에 결과
  else miniLayer().innerHTML = `${metersHtml("scene")}${resHtml}`;
  setNav({ game: true, back: true });
  document.getElementById("mini-continue").addEventListener("click", () => { closeMiniLayer(); done(res); });
  const r = document.getElementById("mini-res");
  setTimeout(() => { if (r && r.isConnected) r.scrollIntoView({ behavior: "smooth", block: "nearest" }); }, 60);
}
// 받침에 따라 "로/으로" (ㄹ 받침은 "로")
// 받침에 따라 조사 고르기: jo("라디오", "을", "를") → "라디오를". 끝의 (괄호)는 빼고 보고, 한글로 안 끝나면 "을(를)"
function jo(word, a, b) { const w = String(word).replace(/\s*\([^)]*\)\s*$/, ""); const c = w.charCodeAt(w.length - 1) - 0xAC00; return word + (!w || c < 0 || c > 11171 ? a + "(" + b + ")" : c % 28 ? a : b); }
function ro(word) { const c = word.charCodeAt(word.length - 1) - 0xAC00; if (c < 0 || c > 11171) return "로"; const j = c % 28; return j && j !== 8 ? "으로" : "로"; }
const CLOTH_IDS = ["towel", "hanky", "clothes", "tissue1", "wetwipe", "med", "pillpouch"];

        const slow = bpm < 100 ? "느렸" : "빨랐";
        // 박자가 고른가: 탭 사이 간격 가운데 0.4~0.75초(분당 80~150회)인 것이 3분의 2 이상이어야 함
        let even = 0; for (let i = 1; i < taps.length; i++) { const g = taps[i] - taps[i - 1]; if (g >= 400 && g <= 750) even++; }
        const steady = even / (taps.length - 1) >= 2 / 3;
        if (bpm >= 100 && bpm <= 120 && !steady) return end({ ok: false, hp: -6, big: `분당 ${bpm}회`, text: "평균은 맞았지만 박자가 들쭉날쭉했어요. 느리게 누르다 몰아서 누르면 피가 제대로 돌지 않아요. 처음부터 끝까지 같은 빠르기로 눌러야 해요.", log: `🫀 가슴압박 평균 분당 ${bpm}회 · 박자가 고르지 않음 ❌`, tip });
        if (bpm >= 100 && bpm <= 120) return end({ ok: true, hp: 6, big: `분당 ${bpm}회`, text: "딱 좋은 박자예요! 숨이 돌아올 때까지 버틸 수 있겠어요.", log: `🫀 가슴압박 박자 분당 ${bpm}회 ✅`, tip });
        return end({ ok: false, hp: -6, big: `분당 ${bpm}회`, text: `${bpm >= 90 && bpm <= 130 ? "조금" : "너무"} ${slow}어요. 효과가 있는 박자는 분당 100~120회예요. ${bpm < 100 ? "더 빠르게" : "조금 천천히, 대신 깊게"} 눌러야 해요.`, log: `🫀 가슴압박 박자 분당 ${bpm}회 ❌`, tip });
      };
      const tap = e => {
        if (e) e.preventDefault();
        const now = performance.now();
        if (!t0) {
          t0 = now;
          iv = setInterval(() => {
            const left = 10 - (performance.now() - t0) / 1000;
            leftEl.textContent = Math.max(0, left).toFixed(1);
            if (left <= 0) finish();
          }, 100);
        }
        taps.push(now);
        heart.classList.remove("push"); void heart.offsetWidth; heart.classList.add("push");
        const b = avgBpm(false);
        if (b && bpmEl) { bpmEl.textContent = b; bpmEl.className = b >= 100 && b <= 120 ? "good" : "bad"; }
      };
      const onKey = e => { if ((e.key === " " || e.key === "Enter") && !e.repeat) tap(e); };
      heart.addEventListener("pointerdown", tap);
      window.addEventListener("keydown", onKey);
      miniStop = () => { clearInterval(iv); window.removeEventListener("keydown", onKey); };
    }
  },

  // 🩹 지혈: 상처가 여기저기 하나씩 생김 → 재빨리 꾹 눌러 막기 (하드는 거의 막힐 즈음 다음 상처가 생김)
  bleed: {
    title: "🩹 지혈하기",
    intro: "깨진 유리에 팔을 베였다! 피가 멈추지 않는다.",
    how: () => {
      const c = clothItem(), n = hardMode ? 6 : 3;
      return `상처(🩸)가 <strong>여기저기</strong> 생겨요. 생기는 곳을 재빨리 <strong>꾹 누른 채</strong> 게이지가 찰 때까지 버티세요. 모두 ${n}곳, 늦으면 놓쳐요.${hardMode ? " 🔥 하드: 하나를 거의 막을 즈음 <strong>다음 상처가 다른 곳에</strong> 생겨요." : ""}${c ? ` 가방의 ${nameOf(c)}${ro(ITEM_BY_ID[c].name)} 누르니까 더 빨리 막혀요.` : " (천이나 구급약이 있으면 더 빨리 막혀요)"}`;
    },
    play(box, end) {
      const cloth = clothItem(), N = hardMode ? 6 : 3;
      const HOLD = (hardMode ? 1.0 : 1.3) * (cloth ? 0.7 : 1);   // 한 곳을 막는 데 누르는 시간(초). 천·구급약이 있으면 30% 빠름
      const LIFE = hardMode ? 1.4 : 3.2;                         // 이 시간 + HOLD 안에 못 막으면 놓침
      const LIMIT = hardMode ? 11 : 14;
      const size = hardMode ? (cloth ? 50 : 40) : (cloth ? 84 : 70);   // 천·구급약이 있으면 누르는 곳이 큼
      box.innerHTML = `
        <p class="mini-tag">🩹 지혈 · ${LIMIT}초 안에 ${N}곳${cloth ? ` · ${ITEM_BY_ID[cloth].emo} 사용` : ""}</p>
        <div class="wound-area" id="wound-area"><span class="arm" aria-hidden="true">💪</span></div>
        <div class="hold-bar"><i id="hold-fill"></i></div>
        <p class="mini-live">막은 곳 <b id="bl-done">0</b> / ${N} · 놓친 곳 <b id="bl-miss">0</b> · 남은 시간 <b id="bl-left">${LIMIT}.0</b>초</p>`;
      const area = document.getElementById("wound-area"), fill = document.getElementById("hold-fill");
      const doneEl = document.getElementById("bl-done"), missEl = document.getElementById("bl-miss"), leftEl = document.getElementById("bl-left");
      const tip = "지혈의 기본은 깨끗한 천(거즈·수건)으로 상처를 세게 직접 누르는 것. 피가 배어 나와도 천을 떼지 말고 위에 덧대요. 실제로는 피가 멈출 때까지, 몇 분이 걸려도 계속 눌러요.";
      let done = 0, miss = 0, spawned = 0, wounds = [], gapUntil = 0, over = false;
      const t0 = performance.now(); let last = t0;
      const spawn = () => {
        spawned++;
        let x, y, tries = 0;
        do { x = 14 + Math.random() * 72; y = 18 + Math.random() * 64; tries++; }   // 지금 상처와 떨어진 곳에
        while (tries < 12 && wounds.some(w => Math.abs(w.x - x) < 28 && Math.abs(w.y - y) < 28));
        const el = document.createElement("button");
        el.type = "button"; el.className = "wound pop"; el.textContent = "🩸";
        el.setAttribute("aria-label", "상처 누르기 (스페이스를 꾹 눌러도 돼요)");
        Object.assign(el.style, { left: x + "%", top: y + "%", width: size + "px", height: size + "px", fontSize: Math.round(size * 0.5) + "px" });
        const w = { el, x, y, held: 0, holding: false, born: performance.now() };
        el.addEventListener("pointerdown", e => { e.preventDefault(); w.holding = true; el.classList.add("pressed"); try { el.setPointerCapture(e.pointerId); } catch (err) {} });
        const up = () => { w.holding = false; el.classList.remove("pressed"); };
        el.addEventListener("pointerup", up); el.addEventListener("pointercancel", up); el.addEventListener("lostpointercapture", up);
        el.addEventListener("contextmenu", e => e.preventDefault());
        area.appendChild(el); wounds.push(w);
      };
      const drop = (w, missed) => {
        if (missed) { w.el.classList.add("missed"); setTimeout(() => w.el.remove(), 250); } else w.el.remove();
        wounds = wounds.filter(x => x !== w);
        if (!wounds.length) gapUntil = performance.now() + (hardMode ? 120 : 350);
      };
      const kd = e => { if (e.key === " " && !e.repeat && wounds[0]) { e.preventDefault(); wounds[0].holding = true; wounds[0].el.classList.add("pressed"); } };
      const ku = e => { if (e.key === " ") wounds.forEach(w => { w.holding = false; w.el.classList.remove("pressed"); }); };
      window.addEventListener("keydown", kd); window.addEventListener("keyup", ku);
      const cleanup = () => { clearInterval(iv); window.removeEventListener("keydown", kd); window.removeEventListener("keyup", ku); };
      const finish = () => {
        if (over) return; over = true; cleanup();
        if (done >= N) end({ ok: true, hp: -2, big: `${N}/${N}`, text: "상처마다 꾹 눌러 피를 멈췄다. 조금 어지럽지만 괜찮다.", log: `🩹 지혈 성공 ${N}/${N}${cloth ? " (" + ITEM_BY_ID[cloth].name + ")" : ""}`, tip });
        else if (done >= N - 1) end({ ok: false, mid: true, hp: -6, big: `${done}/${N}`, text: "한 곳을 늦게 막았다. 피를 꽤 흘렸다.", log: `🩹 지혈 ${done}/${N}`, tip });
        else end({ ok: false, hp: -12, big: `${done}/${N}`, text: "피가 쉽게 멈추지 않았다. 한참 뒤에야 겨우 멎었다. 머리가 핑 돈다.", log: `🩹 지혈 ${done}/${N} ❌`, tip });
      };
      const iv = setInterval(() => {
        const now = performance.now(), dt = Math.min(0.2, (now - last) / 1000); last = now;   // 화면이 가려졌다 돌아와도 한 번에 크게 뛰지 않게
        const left = LIMIT - (now - t0) / 1000;
        leftEl.textContent = Math.max(0, left).toFixed(1);
        if (left <= 0) return finish();
        if (!wounds.length && spawned < N && now >= gapUntil) spawn();
        // 🔥 하드: 누르던 상처가 65% 막혔을 때 다음 상처가 다른 곳에 생김
        if (hardMode && wounds.length === 1 && spawned < N && wounds[0].held >= HOLD * 0.65) spawn();
        for (const w of [...wounds]) {
          w.held = w.holding ? w.held + dt : Math.max(0, w.held - dt * (hardMode ? 1.2 : 0.6));
          if (w.held >= HOLD) { done++; doneEl.textContent = done; drop(w, false); }
          else if (!w.holding && (now - w.born) / 1000 > LIFE + HOLD) { miss++; missEl.textContent = miss; drop(w, true); }
        }
        const show = wounds.find(w => w.holding) || wounds[0];
        fill.style.width = show ? Math.min(100, show.held / HOLD * 100) + "%" : "0%";
        if (done + miss >= N) finish();
      }, 50);
      miniStop = cleanup;
    }
  },

  // 🧯 소화기: 그림 속 부분을 차례로 눌러 준비 → 불 연타로 쓸어 끄기 (다음에 누를 곳이 빛남)
  fire: {
    title: "🧯 소화기 쓰기",
    intro: "불이 붙었다! 벽에 소화기가 걸려 있다.",
    how: () => "빛나는 곳을 차례로 눌러요. ① <strong>안전핀</strong> 뽑기 → ② <strong>노즐</strong>을 불 쪽으로 → ③ <strong>손잡이</strong> 꽉 쥐기 → ④ 여기저기 붙는 <strong>불을 눌러</strong> 끄기 (5개). <strong>틀릴 때마다 꺼야 할 불이 하나씩 늘어요.</strong>" + (hardMode ? " 🔥 하드: 불이 훨씬 빨리 번져요. 하나씩 두 번씩 눌러서 15개를 끄세요 (한꺼번에 6개가 되면 실패)." : ""),
    play(box, end) {
      const STEPS = ["pin", "aim", "grip"];
      const LIMIT = hardMode ? 12 : 16;
      const KILL = hardMode ? 15 : 5, MAXFIRES = hardMode ? 5 : 6, FIRE_HP = hardMode ? 2 : 1;   // 보통: 불 5개를 한 번씩 · 🔥 하드: 10개를 두 번씩
      const SPAWN = hardMode ? 450 : 650, PREP_SPAWN = hardMode ? 1000 : 1400;   // 준비 중에도 불이 조금씩 번짐
      const MSG = ["① 소화기 손잡이 위 <b>안전핀</b>을 뽑아요", "② <b>노즐(호스)</b>을 불 쪽으로 향해요", "③ <b>손잡이</b>를 꽉 쥐어요", hardMode ? "④ 이제 뿌려요! 🔥를 하나씩 <b>두 번씩</b> 눌러 꺼요!" : "④ 이제 뿌려요! <b>🔥를 눌러서</b> 하나씩 꺼요!"];
      let step = 0, mistakes = 0, killed = 0, fires = 0, over = false;
      let extra = 0;   // 보통 모드: 실수할 때마다 꺼야 할 불이 하나 늘어남 (최대 4개)
      const need = () => KILL + extra;
      const t0 = performance.now(); let lastSpawn = t0;
      box.innerHTML = `
        <p class="mini-tag">🧯 소화기 · ${LIMIT}초 안에</p>
        <div class="fx-wrap">
          <div class="fx-ext">
            <button class="fx-part glow" type="button" data-step="pin">📌<small>안전핀</small></button>
            <button class="fx-part" type="button" data-step="aim">🎯<small>노즐</small></button>
            <button class="fx-part" type="button" data-step="grip">✊<small>손잡이</small></button>
            <span class="fx-can" aria-hidden="true">🧯</span>
          </div>
          <div class="fx-field" id="fx-field"></div>
        </div>
        <div class="hold-bar"><i id="fx-spray"></i></div>
        <p class="mini-live dr-msg" id="fire-msg">${MSG[0]} <small class="note">· 불이 번지고 있어요!</small></p>
        <p class="mini-live">남은 시간 <b id="fire-left">${LIMIT}.0</b>초 · 꺼야 할 불 <b id="fire-need">${KILL}</b> · 실수 <b id="fire-miss">0</b></p>`;
      const field = document.getElementById("fx-field"), msg = document.getElementById("fire-msg"), leftEl = document.getElementById("fire-left");
      const spray = document.getElementById("fx-spray"), missEl = document.getElementById("fire-miss"), needEl = document.getElementById("fire-need");
      const parts = [...box.querySelectorAll("[data-step]")];
      const tip = "소화기 쓰는 순서: ① 안전핀 뽑기 ② 호스(노즐)를 불 쪽으로 ③ 손잡이 꽉 쥐기 ④ 빗자루로 쓸듯이 뿌리기. 불이 천장까지 번졌으면 끄지 말고 대피해요.";
      const finish = ok => {
        if (over) return; over = true; clearInterval(iv);
        box.querySelectorAll("button").forEach(b => { b.disabled = true; }); field.classList.remove("ready");
        field.insertAdjacentHTML("beforeend", `<div class="fx-done ${ok ? "ok" : "bad"}">${ok ? "💨 불이 모두 꺼졌어요!" : "🔥 불이 걷잡을 수 없이 번졌어요…"}</div>`);
        msg.innerHTML = ok ? "✅ <b>진화 완료!</b> 이제 손을 떼도 돼요" : "❌ 불을 끄지 못했어요";
        setTimeout(() => { if (box.isConnected) finishEnd(ok); }, 1100);
      };
      const finishEnd = ok => {
        if (ok) end({ ok: true, hp: 0, big: mistakes ? `실수 ${mistakes}번` : "실수 없이", text: "하얀 분말이 덮치자 불이 꺼졌다. 휴…", log: `🧯 소화기로 불을 끔${mistakes ? ` (실수 ${mistakes}번)` : " ✅"}`, tip });
        else end({ ok: false, hp: -10, big: "", text: "불이 순식간에 번졌다. 연기를 마시며 겨우 빠져나왔다.", log: "🧯 소화기 실패 · 불이 번짐 ❌", tip });
      };
      const canSpawn = () => !over && (hardMode ? killed + fires < KILL + 3 : killed + fires < need());
      const spawnFire = () => {
        if (!canSpawn()) return;
        const f = document.createElement("button"); f.type = "button"; f.className = "fx-spot pop"; f.textContent = "🔥"; f.dataset.hp = String(FIRE_HP);
        f.style.left = (10 + Math.random() * 76) + "%"; f.style.top = (12 + Math.random() * 70) + "%";
        onTap(f, () => {
          if (over || !f.isConnected) return;
          if (step < 3) return mistake(f, "아직 소화기 준비가 안 됐어요!");
          f.dataset.hp = String(Number(f.dataset.hp) - 1); f.classList.add("hit");
          if (Number(f.dataset.hp) > 0) return;
          f.remove(); fires--; killed++; needEl.textContent = Math.max(0, need() - killed);
          spray.style.width = Math.min(100, killed / need() * 100) + "%";
          if (killed >= need()) finish(true);

        field.appendChild(f); fires++;
        if (fires > MAXFIRES) finish(false);
      };
      const mistake = (el, text) => {
        mistakes++; missEl.textContent = mistakes;
        if (!hardMode && extra < 4) { extra++; needEl.textContent = Math.max(0, need() - killed); spray.style.width = Math.min(100, killed / need() * 100) + "%"; }
        msg.innerHTML = text + (hardMode ? " 불이 번졌다!" : " 불이 번져 꺼야 할 불이 늘었어요!");
        el.classList.add("shake"); setTimeout(() => el.classList.remove("shake"), 400);
        spawnFire();   // 틀리면 불이 하나 더 붙음
      };
      parts.forEach(b => b.addEventListener("click", () => {
        if (step >= 3) return;
        if (b.dataset.step !== STEPS[step]) return mistake(b, "앗, 순서가 틀렸어요!");
        b.classList.remove("glow"); b.classList.add("done"); b.disabled = true; step++;
        msg.innerHTML = MSG[step];
        if (step < 3) parts[step].classList.add("glow");
        else { field.classList.add("ready"); lastSpawn = performance.now(); }
      }));
      spawnFire();   // 처음부터 불 하나
      const iv = setInterval(() => {
        const now = performance.now(), left = LIMIT - (now - t0) / 1000;
        leftEl.textContent = Math.max(0, left).toFixed(1);
        if (now - lastSpawn > (step < 3 ? PREP_SPAWN : SPAWN)) { lastSpawn = now; spawnFire(); }
        if (left <= 0) finish(false);
      }, 100);
      miniStop = () => clearInterval(iv);
    }
  },

  // 📻 주파수 맞추기: 다이얼로 KBS 1라디오(서울 FM 97.3)를 잡고, 가짜 방송 골라내기
  radio: {
    title: "📻 주파수 맞추기",
    intro: "라디오를 켰다. 지지직… 잡음뿐이다.",
    how: () => "다이얼을 돌려 <strong>KBS 1라디오 FM 97.3</strong>(재난방송 주관 방송사)에 맞추세요. 맞추면 재난방송이 들려요." + (hardMode ? " 🔥 하드: <strong>처음 위치만 보여 주고, 다이얼을 움직이면 숫자가 가려져요.</strong> 대충 어디쯤인지 감으로 찾으세요." : ""),
    play(box, end) {
      const TARGET = 973, LIMIT = hardMode ? 6 : 20;
      const NEWS = "공습경보가 계속되고 있습니다. 가까운 지하 대피시설로 이동하고, 안내가 있을 때까지 머무르십시오. 정부 발표는 이 방송으로 계속 알려 드립니다.";
      // 🔥 하드: 다이얼 양 끝을 매번 바꿔서 97.3이 늘 가운데 있지 않게
      const RD_SPAN = 120 + Math.floor(Math.random() * 80), RD_POS = 0.15 + Math.random() * 0.7;   // 다이얼 폭 12~20MHz, 97.3 위치 15~85%
      const RD_MIN = hardMode ? Math.max(875, Math.round(TARGET - RD_SPAN * RD_POS)) : 875;
      const RD_MAX = hardMode ? Math.min(1080, RD_MIN + RD_SPAN) : 1080;
      const farStart = () => { let s; do { s = RD_MIN + Math.floor(Math.random() * (RD_MAX - RD_MIN + 1)); } while (Math.abs(s - TARGET) < 25); return s; };
      const start = hardMode ? farStart() : Math.random() < 0.5 ? 881 + Math.floor(Math.random() * 40) : 1020 + Math.floor(Math.random() * 50);
      box.innerHTML = `
        <p class="mini-tag">📻 주파수 · ${LIMIT}초 안에</p>
        <div class="rd-face"><b id="rd-freq"></b><span id="rd-noise"></span></div>
        <input type="range" id="rd-dial" class="rd-dial" min="${RD_MIN}" max="${RD_MAX}" step="1" value="${start}" aria-label="주파수 다이얼">
        <div class="rd-fine"><button class="btn ghost small" type="button" data-d="-1">◀ 0.1</button><button class="btn ghost small" type="button" data-d="1">0.1 ▶</button></div>
        <div class="rd-lines" id="rd-lines"></div>
        <p class="mini-live">남은 시간 <b id="rd-left">${LIMIT}.0</b>초</p>`;
      const dial = document.getElementById("rd-dial"), freqEl = document.getElementById("rd-freq"), noise = document.getElementById("rd-noise");
      const leftEl = document.getElementById("rd-left"), linesEl = document.getElementById("rd-lines");
      const tip = "전쟁·재난 때는 KBS가 재난방송을 맡아요. 휴대폰이 끊겨도 건전지 라디오로 KBS 1라디오(서울 FM 97.3 / AM 711)를 들을 수 있어요. 출처 없는 소문보다 공식 방송을 믿어요.";
      let tuned = false, t0 = performance.now();
      let iv = null, moved = false;   // 🔥 하드: 다이얼을 움직이면 숫자가 가려짐
      let ended = false;
      const finish = res => { if (ended) return; ended = true; clearInterval(iv); dial.disabled = true; box.querySelectorAll("[data-d]").forEach(b => b.disabled = true); end(res); };
      const update = () => {
        if (ended) return;
        const v = Number(dial.value), diff = Math.abs(v - TARGET);
        freqEl.textContent = hardMode && diff && moved ? "FM ??.?" : `FM ${(v / 10).toFixed(1)}`;
        if (diff === 0) {
          tuned = true; clearInterval(iv); dial.disabled = true;   // 맞추는 순간 타이머 멈춤
          box.querySelectorAll("[data-d]").forEach(b => b.disabled = true);
          noise.textContent = "📶 KBS 1라디오 · 재난방송"; noise.className = "good";
          linesEl.innerHTML = `<p class="rd-news">📢 “${NEWS}”</p>`;
          setTimeout(() => box.isConnected && finish({ ok: true, hp: 3, big: "KBS 재난방송 수신", text: `📢 “${NEWS}” 공식 안내를 듣고 침착하게 움직였다.`, log: "📻 KBS 재난방송을 잡았다 ✅", tip }), 1800);
        } else {
          noise.className = "";
          noise.textContent = diff <= (hardMode ? 2 : 3) ? "…치직… 공습… 치직… 대피…" : diff <= (hardMode ? 6 : 10) ? "지직… 사람 목소리 같은데…" : "지지지지직……";
        }
      };
      dial.addEventListener("input", () => { moved = true; update(); });
      box.querySelectorAll("[data-d]").forEach(b => b.addEventListener("click", () => { moved = true; dial.value = Number(dial.value) + Number(b.dataset.d); update(); }));
      update();
      iv = setInterval(() => {
        const left = LIMIT - (performance.now() - t0) / 1000;
        leftEl.textContent = Math.max(0, left).toFixed(1);
        if (left <= 0 && !tuned) finish({ ok: false, hp: -3, big: "", text: "끝내 방송을 잡지 못했다. 잡음만 듣다 배터리만 닳았다.", log: "📻 주파수를 못 맞춤 ❌", tip });
      }, 100);
      miniStop = () => clearInterval(iv);
    }
  },

  // 🚇 지하철 비상문: 덮개 열기 → 손잡이 당기기 → 공기 빠질 때까지 기다리기 → 문 밀기
  door: {
    title: "🚇 비상문 열기",
    intro: "비상 개폐 장치로 출입문을 연다.",
    how: () => "빛나는 곳을 차례로 눌러요. ① <strong>비상 개폐 장치 덮개</strong> 열기 → ② <strong>빨간 손잡이</strong> 당기기 → ③ <strong>공기 게이지가 다 빠질 때까지</strong> 기다리기 → ④ <strong>문을 연타</strong>해서 밀기" + (hardMode ? " 🔥 하드: 문이 무거워서 쉬지 않고 밀어야 열려요." : ""),
    play(box, end) {
      const LIMIT = hardMode ? 10 : 15, HISS = 2500, PUSHES = hardMode ? 18 : 6, MAXMISS = hardMode ? 1 : 3;   // 🔥 하드: 문이 무거워서 많이 밀어야 함
      let lastPush = 0;
      let step = 0, mistakes = 0, hissUntil = 0, pushes = 0, t0 = performance.now();   // step 0 덮개 · 1 손잡이 · 2 기다림/밀기
      box.innerHTML = `

          <div class="dr-gauge" id="dr-gauge" aria-label="공기 압력"><i id="hiss-fill"></i><span>공기</span></div>

      const gauge = document.getElementById("dr-gauge");
      const door = document.getElementById("door"), boxEl = document.getElementById("dr-box"), msg = document.getElementById("door-msg"), fill = document.getElementById("hiss-fill");
      const leftEl = document.getElementById("door-left"), missEl = document.getElementById("door-miss");
      const tip = "실제로는 ① 비상통화장치로 승무원에게 먼저 알리고 ② 안내가 있으면 출입문 옆·좌석 아래 비상 개폐 장치 덮개를 열어 손잡이를 당긴 뒤 ③ 공기 빠지는 소리가 멈추면 문을 양손으로 밀어요. 터널에선 반대편 선로로 오는 열차와 바닥의 전선을 조심하고 유도등을 따라가요.";
      let ended = false;

        if (ended) return; ended = true;

        else end({ ok: false, hp: -6, big: "", text: "문이 꿈쩍도 하지 않았다. 허둥대는 사이 옆 사람이 대신 열었다.", log: "🚇 비상문 열기 실패 ❌", tip });

  // 🔍 대피소 표지 찾기: 비슷한 표지 4개 중 민방위 대피소 표지 고르기 × 3번
  sign: {
    title: "🔍 대피소 표지 찾기",
    intro: "지하 안쪽 대피 구역을 찾아야 한다. 비슷한 표지판이 여기저기 붙어 있다!",
    how: () => hardMode ? "<strong>민방위 대피소</strong> 표지를 고르세요. 🔥 한 번에 <strong>2초</strong>, 보기 <strong>9개</strong> 중에서 모두 <strong>9번</strong>! 갈수록 색이 빠져서 마지막엔 거의 흑백이에요. 누르자마자 다음 문제가 바로 떠요." : "표지 4개 중 <strong>공습 때 들어갈 민방위 대피소</strong> 표지를 고르세요. 🚨 한 번에 <strong>3초</strong>, 모두 3번이에요. 망설이면 늦어요!",
    play(box, end) {

      const FAKES = [
        { html: `<span class="sg-emo">🏃</span><b>비상구</b><small>EXIT</small>`, cls: "exit", why: "비상구는 건물 밖으로 나가는 문이에요." },
        { html: `<span class="sg-emo">🏞️</span><b>지진 옥외대피장소</b><small>야외 공터</small>`, why: "지진 때 가는 야외 공터예요. 공습 땐 지하로!" },
        { html: `<span class="sg-emo">☀️</span><b>무더위쉼터</b><small>여름 휴식</small>`, why: "여름 더위를 피하는 곳이에요." },
        { html: `<span class="sg-emo">🌊</span><b>지진해일 긴급대피장소</b><small>높은 곳</small>`, why: "해일 때 높은 곳으로 가는 표지예요." },
        { html: `<span class="sg-emo">🏫</span><b>이재민 임시주거시설</b><small>재난 뒤 숙소</small>`, why: "재난 뒤 머무는 곳이라 공습 대피와는 달라요." }
      ];
      const ROUNDS = hardMode ? 9 : 3, SEC = hardMode ? 2 : 3, shuffle = a => [...a].sort(() => Math.random() - 0.5);
      // 🖼 그림이 있으면 모두 그림 카드, 없으면 모두 글자 카드 (섞으면 정답이 티 남)
      REAL.name = "민방위 대피소";
      ["exit", "quake", "heat", "tsunami", "relief"].forEach((k, i) => {
        FAKES[i].key = k;
        FAKES[i].name = ["비상구", "지진 옥외대피장소", "무더위쉼터", "지진해일 긴급대피장소", "이재민 임시주거시설"][i];
        if (SIGN_WHY[k]) FAKES[i].why = SIGN_WHY[k];
      });
      const realPool = shuffle(["real_1", "real_2", "real_3"].filter(k => SIGN_IMG[k]));
      const imgFakes = FAKES.filter(f => SIGN_IMG["fake_" + f.key]);
      const imageMode = realPool.length > 0 && imgFakes.length >= 3;
      const fakePool = imageMode ? imgFakes : FAKES;
      let round = 0, right = 0, t0 = 0, iv = null, lastWhy = "";
      const tip = "공습 땐 야외 대피장소가 아니라 지하 대피시설로 가요. 지하철역·지하주차장·큰 건물 지하에 대피소 표지가 붙어 있어요. ‘안전디딤돌’ 앱에서 집·회사 근처 대피소를 미리 찾아 두세요.";
      const finish = () => {
        clearInterval(iv);
        if (right === ROUNDS) end({ ok: true, hp: 0, big: `${right}/${ROUNDS}`, text: "망설임 없이 대피소로 뛰어들었다.", log: `🔍 대피소 표지 ${right}/${ROUNDS} ✅`, tip });
        else if (right >= ROUNDS - (hardMode ? 2 : 1)) end({ ok: false, mid: true, hp: hardMode ? -5 : -3, big: `${right}/${ROUNDS}`, text: `한 번 헷갈려서 돌아 나왔다. ${lastWhy}`, log: `🔍 대피소 표지 ${right}/${ROUNDS}`, tip });
        else end({ ok: false, hp: hardMode ? -12 : -8, big: `${right}/${ROUNDS}`, text: `엉뚱한 곳을 헤매다 한참 늦었다. ${lastWhy}`, log: `🔍 대피소 표지 ${right}/${ROUNDS} ❌`, tip });
      };
      const next = () => {
        if (round >= ROUNDS) return finish();
        round++;
        const nCards = hardMode ? 9 : 4;   // 🔥 하드: 처음부터 9개
        const fakes = []; while (fakes.length < nCards - 1) fakes.push(...shuffle(fakePool));
        const cards = shuffle([REAL, ...fakes.slice(0, nCards - 1)]);
        const realKey = imageMode ? realPool[(round - 1) % realPool.length] : null;
        const cardHtml = (c, i) => imageMode
          ? `<button class="sg-card sg-img" type="button" data-c="${i}" aria-label="표지 ${i + 1}"><img src="${SIGN_IMG[c.real ? realKey : "fake_" + c.key]}" alt=""><span class="sg-name">${c.name}</span></button>`
          : `<button class="sg-card ${c.cls || ""}" type="button" data-c="${i}">${c.html}</button>`;
        box.innerHTML = `
          <p class="mini-tag"><span class="ic ic-search"></span>표지 찾기 · ${round} / ${ROUNDS}</p>
          <p class="sg-timer">⏱ <b id="sg-left">${SEC}</b>초</p>
          <div class="hold-bar sg-urgent"><i id="sg-fill" style="width:100%"></i></div>
          <div class="sg-grid${nCards > 4 ? " sg-many" : ""}" style="grid-template-columns:repeat(${nCards > 4 ? 3 : 2},1fr)${hardMode ? `;filter:saturate(${(round >= 7 ? 0.03 : 0.5 - (round - 1) * 0.07).toFixed(2)})` : ""}">${cards.map(cardHtml).join("")}</div>
          <p class="mini-live">맞힌 수 <b>${right}</b></p>`;
        box.classList.remove("sg-shake", "sg-shake1");
        if (round === 1) { void box.offsetWidth; box.classList.add("sg-shake"); }
        else if (hardMode && round === 9) { void box.offsetWidth; box.classList.add("sg-shake1"); }   // 하드 9번: 한 번 살짝   // 첫 판: 화면 흔들림
        const fillEl = document.getElementById("sg-fill");
        let picked = false;
        const pick = (c, idx) => {
          if (picked) return; picked = true; clearInterval(iv);
          if (c && c.real) right++; else lastWhy = c ? c.why : "머뭇거리다 놓쳤다.";
          box.querySelector(".sg-grid").classList.add("revealed");
          box.querySelectorAll("[data-c]").forEach((b, i) => { b.disabled = true; if (cards[i].real) b.classList.add("right"); else if (i === idx) b.classList.add("wrong"); });
          setTimeout(() => { if (!stopped) next(); }, hardMode ? 180 : imageMode ? 1500 : 700);
        };
        box.querySelectorAll("[data-c]").forEach(b => onTap(b, () => pick(cards[Number(b.dataset.c)], Number(b.dataset.c))));
        let lastSec = -1;   // 1초마다 숫자 갱신 + 삑
        t0 = performance.now();
        iv = setInterval(() => {
          const left = SEC - (performance.now() - t0) / 1000;
          fillEl.style.width = Math.max(0, left / SEC * 100) + "%";
          const sec = Math.ceil(Math.max(0, left));
          if (sec !== lastSec) { lastSec = sec; const el = document.getElementById("sg-left"); if (el) el.textContent = sec; if (sec > 0) Sound.beep(); }
          if (left <= 0) pick(null);
        }, 100);
      };
      let stopped = false;
      miniStop = () => { stopped = true; clearInterval(iv); };
      next();
    }
  }
};

// 선택 하나를 처리 (체력·점수·분기·편의점 구매). 화면과 자동 플레이가 같이 씀
// 🧬 행동 축: 선택 문장이 대담(D)인지 신중(T)인지. 문장에 드러난 행동이 먼저, 그다음에 '점수가 크게 낮은 선택'을 대담으로 봄
const BOLD_RE = /나가|뒤진다|달아|올라탄다|무작정|터널로|차를 몰고|30km|먼저 /;
const CALM_RE = /기다린다|확인한다|지켜보|머문다|남는다|안내대로|따른다|알린다|대기한다|버틴다|숨는다|숨은 채|숨어|잠적|조심조심|더듬더듬|이야기를 듣|이야기를 들으며|모른 척/;
function paceOf(lbl, risky) { return BOLD_RE.test(lbl) ? "D" : CALM_RE.test(lbl) ? "T" : risky ? "D" : ""; }
function applyChoice(index, choice) {
  const cost = choice.move ? moveCost(choice.move) : 0;
  hp = clampHp(hp - cost + (choice.hp || 0));
  // 위험한 선택: 최선이 8점 이상인 장면에서 0~2점짜리를 고름 → 결과에서 −8
  const risky = choice.p <= 2 && bestOf(scenes[index]).p >= 8;
  results[index] = { pts: Math.max(0, choice.p - penalty), label: choice.label, penalty, risky, bad: !!choice.bad, neutral: !!choice.neutral };
  traits.coop += choice.coop || 0;
  traits.duty += choice.duty || 0;
  traits.info = (traits.info || 0) + (choice.info || 0);   // 📡 공식 안내 ↔ 소문
  // 🧬 유형 4축 기록 (사람 · 판단 · 행동)
  if (choice.coop > 0) traits.coopP = (traits.coopP || 0) + choice.coop; else if (choice.coop < 0) traits.coopN = (traits.coopN || 0) - choice.coop;
  { const d = (choice.duty || 0) + (choice.info || 0); if (d > 0) traits.dutyP = (traits.dutyP || 0) + d; else if (d < 0) traits.dutyN = (traits.dutyN || 0) - d; }
  { const lbl = choice.label || choice.t || "";
    if (paceOf(lbl, risky) === "D") traits.bold = (traits.bold || 0) + 1;
    else if (paceOf(lbl, risky) === "T") traits.calm = (traits.calm || 0) + 1; }
  { // 🧬 유형 칸에서 '왜 이렇게 나왔나' 보여 주기용 기록
    const lbl = choice.label || choice.t || "", st = scenes[index] ? scenes[index].stage : "";
    const L = traits.axLog || (traits.axLog = []);
    if (choice.coop > 0) L.push({ k: "A", lbl, st }); else if (choice.coop < 0) L.push({ k: "O", lbl, st });
    const d = (choice.duty || 0) + (choice.info || 0); if (d > 0) L.push({ k: "N", lbl, st }); else if (d < 0) L.push({ k: "M", lbl, st });
    if (paceOf(lbl, risky) === "D") L.push({ k: "D", lbl, st });
    else if (paceOf(lbl, risky) === "T") L.push({ k: "T", lbl, st });
  }
  if (choice.fromItem && choice.p >= 7) traits.itemUses += 1;   // 물건을 상황에 맞게 잘 쓴 횟수
  if (choice.bad) flags.bad = true;
  if (choice.bad) {   // 🧬 나쁜 선택은 성향에도 크게: 내 판단 +2 · 혼자 +1 · 대담 +1(숨거나 지켜보는 선택은 빼고)
    const badBold = paceOf(choice.label || choice.t || "", false) !== "T";
    traits.dutyN = (traits.dutyN || 0) + 2; if (badBold) traits.bold = (traits.bold || 0) + 1; traits.coopN = (traits.coopN || 0) + 1;
    const L = traits.axLog || (traits.axLog = []), lbl = choice.label || choice.t || "", st = scenes[index] ? scenes[index].stage : "";
    L.push({ k: "M", lbl: lbl + " (나쁜 선택 · 크게 반영)", st }, { k: "O", lbl, st }); if (badBold) L.push({ k: "D", lbl, st });
  }
  if (choice.achv) flags["a_" + choice.achv] = true;   // 업적 조건 (예: 심폐소생술)
  if (choice.achv === "cpr") flags.cprAt = index;      // 🦋 가슴압박한 장면 번호
  if (choice.neutral) flags.neutralAt = index;         // 🦋 외면한 장면 번호
  if (choice.bf) flags["bf_" + choice.bf] = true;      // 🦋 나비효과 씨앗
  if (choice.rg) flags["rg_" + choice.rg] = index;     // 🦋 도움을 거절한 장면 번호 → 다음 장면에서 그 결과를 보여 줌
  if (choice.flag) flags[choice.flag] = true;
  if (choice.route) route = choice.route;
  buildScenes();
  // 편의점에서 산 물건은 가방에 넣고, 자리가 없으면 그 자리에서 먹음
  const gainNotes = (choice.gain || []).map(id => {
    const it = ITEM_BY_ID[id];
    if (!addItem(id)) { uses[id] = it.uses; return `🛍️ ${jo(nameOf(id), "을", "를")} 가방에 넣었다.`; }
    hp = clampHp(hp + it.heal);
    return `🛍️ 가방에 자리가 없어 ${jo(nameOf(id), "을", "를")} 그 자리에서 먹었다. ❤️ +${it.heal}`;
  });
  return { cost, gainNotes };
}

function resolve(index, choice) {
  stopUrgent();
  if (results[index]) return;   // 이미 고른 장면 (시간 초과와 누르기가 겹쳐도 한 번만)
  const miniKind = choice.mini || (choice.achv === "cpr" ? "cpr" : null);
  if (miniKind && !choice.miniDone) {
    const lv = document.getElementById("live");
    const next = res => resolve(index, { ...choice, miniDone: true, hp: (choice.hp || 0) + res.hp, miniLog: res.log });
    if (lv) {
      lv.querySelectorAll(".options, #scene-msg, [data-loot], #quick-heal").forEach(x => x.remove());
      lv.insertAdjacentHTML("beforeend", `<p class="picked-line">▶ ${choice.label}</p>`);
      const box = miniInline(lv, miniKind, choice.miniEv || {}, next, index);
      setTimeout(() => box.scrollIntoView({ behavior: "smooth", block: "start" }), 60);
    } else runMini(miniKind, choice.miniEv || {}, next);
    return;
  }
  if (choice.miniLog) miniLog[index] = choice.miniLog;
  const before = hp;
  const mvSave = choice.move ? moveSave(choice.move) : 0, mvHeavy = choice.move ? moveHeavy() : 0, mvHelper = walkHelper();   // 고르기 전 가방 기준
  const { cost, gainNotes } = applyChoice(index, choice);
  const diff = hp - before;
  const s = scenes[index];
  const dead = hp <= 0;
  const last = dead || index + 1 >= scenes.length;
  const outcomeHtml = `
    <div class="outcome" data-idx="${index}" data-from="${before}">
      <p><strong>${choice.label}</strong></p>
      <p>${choice.r || ""}</p>
      ${choice.miniLog ? `<p class="note">🎮 ${choice.miniLog}</p>` : ""}
      ${gainNotes.map(n => `<p class="note">${n}</p>`).join("")}
      ${cost ? `<p class="note">🚶 몸을 많이 써서 지쳤다.${mvSave ? ` ${mvHelper} 덕분에 조금 덜했다.` : ""}${mvHeavy ? " 🏋️ 가방이 무거워서 더 힘들었다." : ""}</p>` : ""}
      ${diff !== 0 ? `<p class="delta hp-sum ${diff < 0 ? "down" : "up"}">❤️ 체력 ${diff > 0 ? "+" : "−"}${Math.abs(diff)} <small>(${before} → ${hp})</small></p>` : ""}
      ${dead ? `<p class="delta down">눈앞이 하얘지며 다리가 풀렸다…</p>` : ""}
    </div>`;
  const live = document.getElementById("live");
  if (!live) {   // 쌓인 화면이 없을 때(예외)는 예전처럼 한 화면
    app.innerHTML = `${metersHtml("scene")}<p class="stage">${s.stage}</p>${outcomeHtml}`;
  } else {
    live.querySelectorAll(".options, #scene-msg, [data-loot], #quick-heal").forEach(x => x.remove());
    live.querySelectorAll("[id]").forEach(x => x.removeAttribute("id"));
    live.removeAttribute("id"); live.classList.add("done");
    live.insertAdjacentHTML("beforeend", outcomeHtml);
    const m = document.getElementById("feed-meters"); if (m) m.innerHTML = metersHtml("scene");
  }
  const rw = document.getElementById("rewind-here");
  if (rw) rw.addEventListener("click", () => rewindTo(index));
  const out = live ? live.querySelector(".outcome") : null;
  // 마지막이거나, 다음 장면이 미니게임으로 시작하면(결과를 읽기 전에 튀어나오지 않게) 버튼으로 넘김
  const nextEvent = false;   // 미니게임 장면도 흐름 안 소개로 이어짐
  if (!live || last || nextEvent) {
    const label = last ? "결과 보기 →" : "다음 ▼";
    const go = () => { const b = document.getElementById("feed-next"); if (b) b.remove(); last ? showResult() : startScene(index + 1); };
    if (live) {   // 다음 버튼은 결과 칸 바로 아래 하나만 (아래 바에는 안 띄움)
      setNav({ game: true, back: true });
      (live.querySelector(".outcome") || live).insertAdjacentHTML("afterend", `<button class="nav-primary highlight feed-next" id="feed-next">${label}</button>`);   // 결과 칸 바로 밑
      document.getElementById("feed-next").addEventListener("click", go);
    } else setNav({ game: true, back: true, primary: { label, fn: go, highlight: true } });
  } else {
    setNav({ game: true, back: true });
    startScene(index + 1);
  }
  // 결과 칸을 화면 가운데로 (결과가 화면보다 길면 윗부분부터 읽게 위에 맞춤). 다음 장면은 아래에 살짝 걸쳐 보임
  if (out) setTimeout(() => { const tall = out.getBoundingClientRect().height > innerHeight * 0.55; out.scrollIntoView({ behavior: "smooth", block: tall ? "start" : "center" }); }, 60);
  else window.scrollTo(0, 0);
  nudgeCheck();
}

const TOOLS_HASH = "eb2fd3b777e34f613a3cb536becd54c8f8b2d0b24ce959e0bbca4a255bdc37d6", TOOLS_KEY = "survival-test-tools";
let toolsOpen = false;

// 프롤로그·가방 싸기를 건너뛰고 가방 세트로 시작 준비
function testSetup(g, setKey, loc) {
  group = g; gender = g === "C" ? "F" : "M";
  if (loc) startLoc = loc;
  resetRun();
  testMode = true;
  const pool = locPool();
  BAG_SETS[setKey].items.filter(id => pool.has(baseOf(id))).forEach(id => addItem(id));   // 이 장소에 없는 물건은 뺌
  startPlaced = placed.map(p => ({ ...p })); startPocket = [...pocket];
  uses = {}; [...placed.map(p => p.id), ...pocket].forEach(id => { if (ITEM_BY_ID[id].uses) uses[id] = ITEM_BY_ID[id].uses; });
}
// 자동 선택: best = 점수 가장 높은 것, random = 지금 쓸 수 있는 것 중 아무거나
function autoChoice(s, mode) {
  const owned = [...placed.map(p => p.id), ...pocket];
  const cands = s.actions.filter(a => !a.need || has(a.need)).map(a => ({ label: a.t, ...a }));
  Object.entries(s.items).forEach(([key, v]) => {
    const cat = ITEM_BY_ID[key] ? ITEM_BY_ID[key].cat : key;
    const id = owned.includes(key) ? key : owned.find(x => cat && ITEM_BY_ID[x].cat === cat);
    if (!id) return;
    const it = ITEM_BY_ID[id];
    cands.push({ label: `🎒 ${nameOf(id)} 사용`, ...v, hp: (v.hp || 0) + (it.heal && it.uses ? it.heal : 0), useId: id, fromItem: true });
  });
  (s.combos || []).forEach(c => { const id = comboItem(c); if (id) cands.push(comboChoice(c, id)); });
  if (mode === "random") return cands[Math.floor(Math.random() * cands.length)];
  // 점수가 같으면 돕는 쪽(성향 선택이 아닌 쪽)을 고름
  return cands.reduce((a, b) => (b.p > a.p || (b.p === a.p && a.neutral && !b.neutral) ? b : a));
}
function autoPlay(mode, from = 0) {
  for (let i = from; i < scenes.length; i++) {
    penalty = 0;
    enterScene(scenes[i]);
    if (hp <= 0) break;
    const c = autoChoice(scenes[i], mode);
    if (c.useId) consume(c.useId);
    applyChoice(i, c);
    if (hp <= 0) break;
  }
  showResult();
}
function testJump(g, setKey, r, idx, hpVal, evac, loc) {
  testSetup(g, setKey, loc);
  route = r; flags.evac = !!evac; buildScenes(); hp = hpVal;
  for (let j = 0; j < idx; j++) results[j] = { pts: bestOf(scenes[j]).p, label: "(테스트로 건너뜀)", penalty: 0 };
  startScene(idx);
}
function testEnding(k) {
  const g = k.startsWith("B_") || k === "fugitive" ? "B" : k.startsWith("C_") ? "C" : "A";
  const r = k === "isolated" ? "home" : k === "community" ? "neighbors" : k === "stranded" ? "road" : "shelter";
  testSetup(g, k === "stranded" ? "car" : k === "exhausted" ? "heavy" : "essentials", "home");
  route = r;
  if (k === "late" || k === "fugitive") { flags.evade = true; flags.bad = true; if (k === "late") flags.surrender = true; }
  buildScenes();
  results[0] = { pts: bestOf(scenes[0]).p, label: "(테스트로 건너뜀)", penalty: 0 };
  forcedEnding = k;
  autoPlay("best", 1);
}

// ───────── 결과 ─────────
// 곁들임 선택지에 쓸 물건: 가진 것 중 needAny(물건 id 또는 분류)에 맞는 첫 번째
const matchesNeed = (id, needAny) => needAny.includes(id) || (ITEM_BY_ID[id].cat && needAny.includes(ITEM_BY_ID[id].cat));
function comboItem(c) { return [...placed.map(p => p.id), ...pocket].find(id => matchesNeed(id, c.needAny)) || null; }
function comboChoice(c, id) {
  const it = ITEM_BY_ID[id];
  return { ...c, label: c.t, useId: c.consume ? id : null, hp: (c.hp || 0) + (c.selfHeal && it.heal ? it.heal : 0), fromItem: true };
}
// 장면의 최선: 이 장소에서 구할 수 없는 물건은 빼고 계산 (지하철엔 라디오·손전등이 없음)
function bestOf(s) {
  const cands = s.actions.filter(a => !a.need && !a.neutral).map(a => ({ label: a.t, p: a.p, item: null }))
    .concat(Object.entries(s.items).map(([key, v]) => {
      const id = poolItemFor(key);
      return id ? { label: `가방에서 ${nameOf(id)} 사용`, p: v.p, item: key } : null;
    }).filter(Boolean))
    .concat((s.combos || []).filter(c => [...locPool(true)].some(id => matchesNeed(id, c.needAny))).map(c => ({ label: c.t, p: c.p, item: c.needAny[0] })));
  return cands.reduce((a, b) => (b.p > a.p ? b : a));
}
function hadForScene(key) {
  return [...startPlaced.map(p => p.id), ...startPocket].some(id => id === key || ITEM_BY_ID[id].cat === key);
}

// ───────── 결과 카드 이미지 (1080×1350, 인스타 세로 비율) ─────────
// 카드는 테마와 상관없이 항상 같은 색 (어두운 올리브 + 신호 황색)
const CARD_HARD = { bg: "#140d0c", panel: "#2a1916", line: "#4a2a24", fg: "#f4e9e4", muted: "#c3a59c", accent: "#ff6a3d", alert: "#b3170f" };
const CARD_MASTER = { bg: "#14171a", panel: "#232930", line: "#3a434c", fg: "#f1f5f9", muted: "#a9b4bf", accent: "#dfe7ee", alert: "#8e9aa6" };
const CARD_NORMAL = { bg: "#1b1f18", panel: "#262b22", line: "#3a4232", fg: "#eef0e6", muted: "#a6ad9b", accent: "#f0b432", alert: "#e5483f" };
function wrapLines(g, text, maxW) {
  // 한글은 글자 단위로 줄바꿈
  const lines = []; let cur = "";
  for (const ch of text) {
    if (g.measureText(cur + ch).width > maxW && cur) { lines.push(cur); cur = ch.trim() ? ch : ""; }
    else cur += ch;
  }
  if (cur) lines.push(cur);
  return lines;
}
// 정해진 너비를 넘으면 글자 크기를 줄여서 한 줄에 맞춤
function fitText(g, text, x, y, maxW, size, weight, family) {
  let s = size;
  do { g.font = `${weight} ${s}px ${family}`; s -= 1; } while (g.measureText(text).width > maxW && s > 14);
  g.fillText(text, x, y);
}
function roundRect(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
async function makeShareCard(d) {
  const CARD = d.master ? CARD_MASTER : d.hard ? CARD_HARD : CARD_NORMAL;   // 🏆 백금 · 🔥 붉은 · 기본 노란   // 🔥 하드는 붉은 카드
  try { await document.fonts.ready; } catch (e) {}
  const W = 1080, H = 1350, P = 80;
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const g = c.getContext("2d");
  const display = '"Black Han Sans", "IBM Plex Sans KR", sans-serif';
  const body = '"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';

  g.fillStyle = CARD.bg; g.fillRect(0, 0, W, H);
  // 위 경고 띠
  g.fillStyle = d.master ? "#c9a227" : CARD.alert; g.fillRect(0, 0, W, 110);   // 도감 완성이면 황금 띠
  g.fillStyle = "#ffffff"; g.font = `52px ${display}`; g.textBaseline = "middle";
  g.fillText(d.master ? "🏆 생존 마스터" : "🚨 생존 테스트", P, 57);
  if (d.master) { g.strokeStyle = "#c9a227"; g.lineWidth = 14; g.strokeRect(7, 7, W - 14, H - 14); }
  {
    // 위 띠: 보통 = 노란, 🔥 하드 = 붉은, 🏆 마스터 = 황금 그라데이션 + 경고 줄무늬 + 이중 테두리
    const T = d.master
      ? { from: "#5b6670", to: "#f1f4f7", frame: "#d9e0e7", inner: "rgba(230,236,242,.45)", stripe: "#cfd8e0", emo: "🏆", title: "", tag: "MASTER", tagColor: "#2a3138", fg: "#ffffff" }
      : d.hard
      ?{ from: "#5e0b07", to: "#e5483f", frame: "#e5483f", inner: "rgba(255,106,61,.35)", stripe: "#f0b432", emo: "🔥", title: "", tag: "HARD", tagColor: "#ffd9cc", fg: "#ffffff" }
      : { from: "#8a5a00", to: "#f0b432", frame: "#f0b432", inner: "rgba(240,180,50,.3)", stripe: "#f0b432", emo: "🚨", title: "", tag: "NORMAL", tagColor: "#fff3d6", fg: "#ffffff" };
    const gr = g.createLinearGradient(0, 0, W, 0); gr.addColorStop(0, T.from); gr.addColorStop(1, T.to);
    g.fillStyle = gr; g.fillRect(0, 0, W, 110);
    g.save(); g.beginPath(); g.rect(0, 110, W, 16); g.clip();
    for (let x = -40; x < W + 40; x += 40) { g.fillStyle = (x / 40) % 2 ? "#1a1a1a" : T.stripe; g.beginPath(); g.moveTo(x, 126); g.lineTo(x + 20, 110); g.lineTo(x + 40, 110); g.lineTo(x + 20, 126); g.closePath(); g.fill(); }
    g.restore();
    const MID = 56;   // 띠(0~110) 가운데: 글자 실제 높이를 재서 위아래 가운데에 맞춤
    const midText = (txt, x, font, color, align, dy = 0) => {
      g.font = font; g.textAlign = align || "left"; g.textBaseline = "alphabetic"; g.fillStyle = color;
      const m = g.measureText(txt);
      g.fillText(txt, x, MID + dy + ((m.actualBoundingBoxAscent || 0) - (m.actualBoundingBoxDescent || 0)) / 2);
      g.textAlign = "left";
    };
    midText(T.emo, P - 4, `56px ${body}`, "#ffffff", "left", 8);
    { g.font = `42px ${display}`; const tagW = g.measureText(T.tag || "").width;
      const room = W - P - tagW - 36 - (P + 78);   // 닉네임이 쓸 수 있는 너비
      let tt = d.nick ? `${d.nick}의 생존 결과` : "나의 생존 결과", fz = 46; g.font = `${fz}px ${display}`;
      while (g.measureText(tt).width > room && fz > 24) { fz -= 2; g.font = `${fz}px ${display}`; }
      while (g.measureText(tt).width > room && tt.length > 4) tt = tt.slice(0, -2) + "…";
      g.save(); g.shadowColor = "rgba(0,0,0,.55)"; g.shadowBlur = 8; g.shadowOffsetY = 2;
      midText(tt, P + 78, `${fz}px ${display}`, T.fg, "left", 8); g.restore(); }
    midText(T.tag, W - P, `42px ${display}`, T.tagColor, "right", 8);
    g.strokeStyle = T.frame; g.lineWidth = 12; g.strokeRect(6, 6, W - 12, H - 12);
    g.strokeStyle = T.inner; g.lineWidth = 2; g.strokeRect(24, 24, W - 48, H - 48);
  }

  // 🃏 카드 3차
  // 그룹 · 루트
  g.textBaseline = "alphabetic"; g.textAlign = "left";
  g.fillStyle = CARD.muted;
  fitText(g, `${GROUPS[group].label} · ${LOCS[startLoc].short}에서 시작 · ${routeName()}`, P, 178, W - P * 2, 28, 500, body);
  const endNo = ENDING_ORDER.indexOf(d.ending) + 1;

  // 엔딩 그림 (위) + ENDING 번호·이름 + 유형 동물 스티커
  const iy = 200, ih = 430, iw = W - P * 2;
  let drewArt = false;
  const artSrc = EP_IMG["END_" + d.ending];
  if (artSrc) {
    try {
      const im = new Image(); im.src = artSrc;
      await new Promise((ok, no) => { im.onload = ok; im.onerror = no; });
      g.save(); roundRect(g, P, iy, iw, ih, 28); g.clip();
      const sw = im.width, sh = Math.min(im.height, im.width * ih / iw), sy = (im.height - sh) * 0.42;
      g.drawImage(im, 0, sy, sw, sh, P, iy, iw, ih);
      const fade = g.createLinearGradient(0, iy + ih * 0.42, 0, iy + ih);
      fade.addColorStop(0, "rgba(8,10,18,0)"); fade.addColorStop(1, "rgba(8,10,18,.9)");
      g.fillStyle = fade; g.fillRect(P, iy, iw, ih);
      g.restore();
      drewArt = true;
    } catch (e) {}
  }
  if (!drewArt) { g.fillStyle = CARD.panel; roundRect(g, P, iy, iw, ih, 28); g.fill(); }
  g.strokeStyle = CARD.line; g.lineWidth = 2; roundRect(g, P, iy, iw, ih, 28); g.stroke();
  g.fillStyle = CARD.accent; g.font = `800 26px ${body}`; g.fillText(`ENDING ${endNo} / ${ENDING_ORDER.length}`, P + 36, iy + ih - 96);
  g.fillStyle = "#ffffff"; g.font = `56px ${display}`; g.fillText(ENDINGS[d.ending].name, P + 36, iy + ih - 36);


  // 칸 3개: 생존율 · 내 유형 · (엔딩 희귀도 / 하드 칭호 / 엔딩 도감)
  const cy = 660, ch = 330, gap = 20, cw = (W - P * 2 - gap * 2) / 3;
  const third = d.hardTitle
    ? { label: "하드 칭호", main: d.hardTitle.split(" ")[0], sub: d.hardTitle.split(" ").slice(1).join(" ") }
    : d.endRate != null
    ? { label: "이 엔딩을 본 사람", main: `${d.endRate}%`, big: true, sub: d.endRate <= 10 ? "희귀 엔딩!" : `엔딩 ${endNo}/${ENDING_ORDER.length}` }
    : { label: "엔딩 도감", main: `${d.found}/${ENDING_ORDER.length}`, big: true, sub: "모은 엔딩" };
  [
    { label: "생존율", main: `${d.score}%`, big: true, sub: d.grade },
    { label: "내 유형", main: d.type ? d.type.emo : "❔", sub: d.type ? d.type.name : "-" },
    third
  ].forEach((cell, i) => {
    const x = P + i * (cw + gap), mx = x + cw / 2;
    g.fillStyle = CARD.panel; roundRect(g, x, cy, cw, ch, 28); g.fill();
    g.textAlign = "center";
    g.fillStyle = CARD.muted; g.font = `600 28px ${body}`; g.fillText(cell.label, mx, cy + 56);
    if (cell.big) {
      let fz = 110; g.font = `${fz}px ${display}`;
      while (g.measureText(cell.main).width > cw - 40 && fz > 56) { fz -= 6; g.font = `${fz}px ${display}`; }
      g.fillStyle = CARD.accent;
    } else { g.font = `96px ${body}`; g.fillStyle = CARD.fg; }
    g.fillText(cell.main, mx, cy + 186);
    g.fillStyle = CARD.fg;
    { const maxW = cw - 32, txt = String(cell.sub || "");
      let fz = 32, lines = [txt];
      g.font = `700 ${fz}px ${body}`;
      while (g.measureText(txt).width > maxW && fz > 26) { fz -= 2; g.font = `700 ${fz}px ${body}`; }
      if (g.measureText(txt).width > maxW) {   // 두 줄: 띄어쓰기 자리 중 두 줄 길이가 가장 비슷한 곳에서 나눔
        fz = 30; g.font = `700 ${fz}px ${body}`;
        const words = txt.split(" "); let best = null;
        for (let i = 1; i < words.length; i++) {
          const a = words.slice(0, i).join(" "), b = words.slice(i).join(" ");
          const d = Math.abs(g.measureText(a).width - g.measureText(b).width);
          if (!best || d < best.d) best = { a, b, d };
        }
        lines = best ? [best.a, best.b] : wrapLines(g, txt, maxW).slice(0, 2);
        while (lines.some(l => g.measureText(l).width > maxW) && fz > 22) { fz -= 2; g.font = `700 ${fz}px ${body}`; }
      }
      const y0 = lines.length > 1 ? cy + 244 : cy + 262;
      lines.forEach((ln, k) => g.fillText(ln, mx, y0 + k * (fz + 8))); }
  });
  g.textAlign = "left";

  // 점수 구성 (작게)
  g.fillStyle = CARD.muted;
  fitText(g, `판단력 ${d.choiceScore}/60 · 준비물 ${d.itemScore}/20 · 체력 ${d.hpScore}/20${d.deduct ? ` · 위험 선택 −${d.deduct}` : ""}`, P, cy + ch + 52, W - P * 2, 28, 500, body);

  // 가장 강한 성향 1줄 + 막대
  if (d.axis) {
    const ay = cy + ch + 118;
    g.fillStyle = CARD.fg; g.font = `700 30px ${body}`;
    const lab = `가장 강한 성향 · ${d.axis.emo} ${d.axis.name} ${d.axis.pct}%`;
    g.fillText(lab, P, ay);
    const bx = P + g.measureText(lab).width + 28, bw = W - P - bx, by = ay - 18;
    if (bw > 80) {
      g.fillStyle = CARD.line; roundRect(g, bx, by, bw, 16, 8); g.fill();
      g.fillStyle = CARD.accent; roundRect(g, bx, by, Math.max(16, bw * d.axis.pct / 100), 16, 8); g.fill();
    }
  }

  // 아래: 채널
  g.strokeStyle = CARD.line; g.lineWidth = 2; g.beginPath(); g.moveTo(P, 1200); g.lineTo(W - P, 1200); g.stroke();
  try {
    const img = new Image(); img.src = AVATAR_SRC;
    await new Promise((ok, no) => { img.onload = ok; img.onerror = no; });
    g.save(); g.beginPath(); g.arc(P + 40, 1270, 40, 0, Math.PI * 2); g.clip(); g.drawImage(img, P, 1230, 80, 80); g.restore();
  } catch (e) {}
  g.fillStyle = CARD.fg; g.font = `700 34px ${body}`; g.fillText("담비", P + 100, 1262);
  g.fillStyle = CARD.muted; g.font = `400 26px ${body}`; g.fillText("YouTube @담비 · Instagram @0728_db", P + 100, 1300);
  g.textAlign = "right"; g.fillStyle = CARD.accent; g.font = `700 30px ${body}`; g.fillText("당신은 살아남을 수 있을까?", W - P, 1262);
  g.fillStyle = CARD.muted; g.font = `400 22px ${body}`; g.fillText("제작 · 담비, peaknicc", W - P, 1300);
  g.textAlign = "left";
  return c;
}

// ───────── 되감기: 그 장면 직전 상태로 돌아가 다시 고르기 ─────────
function rewindTo(index) {
  const snap = snapshots[index];
  if (!snap) return;
  const s = JSON.parse(snap);
  hp = s.hp; placed = s.placed; pocket = s.pocket; uses = s.uses; flags = s.flags; route = s.route;
  results = s.results.map(r => r || undefined); traits = s.traits; lootTaken = new Set(s.lootTaken);
  rewound = true;
  Object.keys(miniLog).forEach(k => { if (Number(k) >= index) delete miniLog[k]; });
  leaveGame(); buildScenes();
  toast("⏪ 그 장면으로 돌아왔어요. 다시 골라 보세요.", true);
  startScene(index);

function cleanNick(v) {
  let raw = String(v || ""); if (raw.normalize) raw = raw.normalize("NFC");   // 조합형 한글 → 완성형 (시트 쪽과 같게)

  const flat = text.toLowerCase().replace(/[\s0-9]/g, "");
  const flat2 = flat.replace(/[ー々ㄱ-ㅎㅏ-ㅣ]/g, "");   // 끼워 넣은 기호·낱자를 뺀 것도 같이 봄 (시ー발, 시ㅡ발)
  return { text, bad: NICK_BAD.some(w => flat.includes(w) || flat2.includes(w)) };
}

}

  async function saveCard() {

// ───────── 플레이 뒤 짧은 설문 (GitHub판만 · 기기마다 한 번 · 안 해도 됨) ─────────
// 결과 화면 아래에 별점만 먼저 보이고, 별을 누르면 나머지 질문이 펼쳐짐. 답은 구글 시트 '설문' 탭에 한 줄.
const SURVEY_KEY = "survival-test-survey";
const SURVEY_Q = [
  { k: "len",   q: "플레이 시간은 어땠나요?",   o: [["short", "짧았다"], ["ok", "적당했다"], ["long", "길었다"]] },
  { k: "hard",  q: "가장 어려웠던 곳은?",       o: [["pack", "가방 싸기"], ["choice", "선택지"], ["mini", "미니게임"], ["none", "없었다"]] },
  { k: "best",  q: "가장 기억에 남는 것은?",    o: [["pack", "가방 싸기"], ["story", "장면 이야기"], ["mini", "미니게임"], ["result", "결과·내 유형"]] },
  { k: "learn", q: "새로 알게 된 게 있었나요?", o: [["much", "많았다"], ["some", "조금 있었다"], ["none", "없었다"]] },
  { k: "again", q: "친구에게 권하고 싶나요?",   o: [["yes", "네"], ["maybe", "글쎄요"], ["no", "아니요"]] },
  { k: "replay", q: "다른 선택으로 또 해 보고 싶나요?", o: [["yes", "네"], ["maybe", "글쎄요"], ["no", "아니요"]] }
];
function surveyDone() { try { return !!localStorage.getItem(SURVEY_KEY); } catch (e) { return false; } }
// force: '피드백·버그 보내기' 화면에서는 이미 보낸 기기에도 다시 보여 줌
let surveyCtx = {};   // 방금 끝난 판 요약 (피드백 화면에서 같이 보냄)
function surveyHtml(force) {
  if (!bugApi() || testMode || (!force && surveyDone())) return "";
  return `<section class="survey" id="survey">
      <p class="sv-title">이 게임 어땠나요? <small>30초 · 안 해도 돼요</small></p>
      <div class="sv-stars" role="group" aria-label="재미 별점">${[1, 2, 3, 4, 5].map(n => `<button type="button" class="sv-star" data-star="${n}" aria-label="별 ${n}개">★</button>`).join("")}</div>
      <div class="sv-more" id="sv-more" hidden>
        ${SURVEY_Q.map(x => `<div class="sv-q"><p>${x.q}</p><div class="sv-opts">${x.o.map(([v, t]) => `<button type="button" class="sv-opt" data-q="${x.k}" data-v="${v}">${t}</button>`).join("")}</div></div>`).join("")}
        <label class="sv-q"><p>한마디 <small>(선택)</small></p><textarea id="sv-text" maxlength="200" placeholder="좋았던 점, 아쉬운 점, 넣었으면 하는 것"></textarea></label>
        <button class="btn" type="button" id="sv-send">보내기</button>
        <span class="msg" id="sv-msg"></span>
      </div>
    </section>`;
}
// ctx: 이번 판 요약 { score, ending, type }
function bindSurvey(ctx) {
  const box = document.getElementById("survey");
  surveyCtx = ctx || {};
  if (!box) return;
  const ans = { fun: 0 }, msg = document.getElementById("sv-msg"), btn = document.getElementById("sv-send");
  box.querySelectorAll(".sv-star").forEach(b => b.addEventListener("click", () => {
    ans.fun = Number(b.dataset.star);
    box.querySelectorAll(".sv-star").forEach(x => x.classList.toggle("on", Number(x.dataset.star) <= ans.fun));
    document.getElementById("sv-more").hidden = false;
  }));
  box.querySelectorAll(".sv-opt").forEach(b => b.addEventListener("click", () => {
    const k = b.dataset.q, same = ans[k] === b.dataset.v;   // 같은 걸 다시 누르면 고른 것 취소
    ans[k] = same ? "" : b.dataset.v;
    box.querySelectorAll(`.sv-opt[data-q="${k}"]`).forEach(x => x.classList.toggle("on", !same && x === b));
  }));
  btn.addEventListener("click", async () => {
    if (!ans.fun || btn.disabled) return;
    btn.disabled = true; msg.className = "msg"; msg.textContent = "보내는 중…";
    const body = { kind: "survey", ...ans, text: document.getElementById("sv-text").value.trim().slice(0, 200), ver: APP_VERSION,
      mode: hardMode ? "hard" : "normal", score: ctx.score, ending: ctx.ending, type: ctx.type, group: group || "", startLoc: startLoc || "" };
    try {
      const r = await (await fetch(bugApi(), { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) })).json();
      if (!r || !r.ok) throw new Error("no");
      try { localStorage.setItem(SURVEY_KEY, APP_VERSION); } catch (e) {}
      grantAchv("feedback");
      if (box.isConnected) box.innerHTML = `<p class="sv-title">고마워요! 더 좋게 만드는 데 쓸게요.</p>`;
    } catch (err) { if (box.isConnected) { msg.textContent = "보내지 못했어요. 잠시 뒤 다시 눌러 주세요."; btn.disabled = false; } }
  });
}
</script>

</html>
