<style>
/* 레이아웃: 폰 한 손 화면 기준 한 줄. 위에 고정 상태바(타이머·무게·체력), 집은 방 탭 → 가구 → 물건, 가방은 장소별 격자(집 9×7), 묶음 물건은 통째로/낱개 선택 */
:root {
  --bg: #f1f2ec;          /* 민방위 올리브 톤 회색 */
  --surface: #ffffff;
  --fg: #1d211b;
  --muted: #5f665a;
  --line: #d6d9cd;
  --accent: #c98a00;      /* 신호 황색 */
  --accent-soft: #fbf0d3;
  --alert: #c4302b;       /* 위급재난문자 적색 */
  --alert-soft: #fbe5e3;
  --bag: #4b5440;         /* 배낭 천 */
  --bag-cell: #5d6750;
  --item: #e9e4d2;
  --item-fg: #1d211b;
  --good: #2f7d4a;
  --mid: #b07400;
  --bad: #b3332e;
  --font-display: "Black Han Sans", "IBM Plex Sans KR", sans-serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161915; --surface: #20241f; --fg: #e9ebe3; --muted: #a2a998; --line: #353a32;
    --accent: #f0b432; --accent-soft: #3a3019; --alert: #ff6b63; --alert-soft: #3d2120;
    --bag: #2c3226; --bag-cell: #3a4232; --item: #d8d2bd; --item-fg: #1d211b;
    --good: #6cc48a; --mid: #f0b432; --bad: #ff6b63; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161915; --surface: #20241f; --fg: #e9ebe3; --muted: #a2a998; --line: #353a32;
  --accent: #f0b432; --accent-soft: #3a3019; --alert: #ff6b63; --alert-soft: #3d2120;
  --bag: #2c3226; --bag-cell: #3a4232; --item: #d8d2bd; --item-fg: #1d211b;
  --good: #6cc48a; --mid: #f0b432; --bad: #ff6b63; color-scheme: dark;
}
* { box-sizing: border-box; touch-action: pan-x pan-y; }   /* 두 번 터치·두 손가락 벌리기로 화면이 확대되지 않게 (스크롤만 허용) */
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px calc(96px + env(safe-area-inset-bottom, 0px));   /* 아래 고정 바만큼 여백 */
}
/* 위쪽 헤더 (담비 채널) */
.topbar { max-width: 560px; margin: 0 auto 10px; display: flex; align-items: center; gap: 10px; }
.brand { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--fg); font-weight: 700; font-size: .95rem; }
.brand img { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; background: var(--line); }
.brand:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 99px; }
.topbar-title { margin-left: auto; font-size: .8rem; font-weight: 700; color: var(--muted); }
/* 아래 고정 바 */
.bottombar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--bg); border-top: 1px solid var(--line);
  padding: 8px max(12px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));
}
.bottombar-inner { max-width: 560px; margin: 0 auto; display: flex; gap: 6px; align-items: stretch; }
.nav-btn {
  font: inherit; font-size: .82rem; font-weight: 700; color: var(--fg); background: var(--surface);
  border: 1.5px solid var(--line); border-radius: 12px; padding: 10px; cursor: pointer; white-space: nowrap; min-height: 46px;
}
.nav-btn.confirm { border-color: var(--bad); color: var(--bad); }
.nav-primary {
  flex: 1; font: inherit; font-weight: 700; font-size: 1rem; border: 0; border-radius: 12px; padding: 10px 14px; cursor: pointer;
  background: var(--fg); color: var(--bg); min-height: 46px;
}
.nav-btn:focus-visible, .nav-primary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; line-height: 1.2; text-wrap: balance; margin: 0; }
h1 { font-size: 2.4rem; }
h2 { font-size: 1.5rem; }
h3 { font-size: 1.15rem; }
p { margin: 0; }
.eyebrow { font-size: .8rem; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
.note { font-size: .85rem; color: var(--muted); }

.siren-line { display: flex; align-items: center; gap: 10px; color: var(--alert); font-weight: 700; font-size: .9rem; }
.siren-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--alert); animation: blink 1.2s infinite; flex: none; }
@keyframes blink { 50% { opacity: .2; } }
@media (prefers-reduced-motion: reduce) { .siren-dot { animation: none; } }

/* 고정 상태바 */
.sticky {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); padding-block: 8px; border-bottom: 1px solid var(--line);
  display: grid; gap: 4px;
}
.meters { display: flex; gap: 16px; align-items: center; font-size: .85rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.meter { display: flex; gap: 6px; align-items: center; flex: 1 1 0; min-width: 0; white-space: nowrap; }
.meter .track { flex: 1; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; min-width: 30px; }
.meter .fill { height: 100%; border-radius: 4px; background: var(--good); transition: width .3s; }
.meter .fill.warn { background: var(--mid); }
.meter .fill.over { background: var(--bad); }
.timer { font-family: var(--font-display); font-size: 2rem; line-height: 1; font-variant-numeric: tabular-nums; color: var(--alert); min-width: 2.2ch; text-align: right; }
.timer.hurry { animation: hurry 1s ease-out infinite; }
@keyframes hurry { 0% { transform: scale(1.35); } 40%, 100% { transform: scale(1); } }
/* 가방 싸기 시간 막대: 초록 → 노랑 → 빨강 */
.tbar { height: 14px; border-radius: 7px; background: var(--line); overflow: hidden; }
.tbar i { display: block; height: 100%; width: 100%; border-radius: 7px; background: var(--good); transform-origin: left; animation: tdrain 60s linear forwards; }
.tbar.hold i { animation-play-state: paused; }
@keyframes tdrain {
  0% { width: 100%; background: var(--good); }
  45% { background: var(--good); }
  65% { background: var(--mid); }
  85%, 100% { background: var(--bad); }
  100% { width: 0; }
}
/* 시작 전 3·2·1 */
.count-ov { position: fixed; inset: 0; z-index: 70; display: grid; place-content: center; justify-items: center; gap: 10px; background: rgba(0,0,0,.55); color: #fff; touch-action: none; }
.count-ov span { font-family: var(--font-display); font-size: 7rem; line-height: 1; font-weight: 900; animation: countPop .8s ease-out; }
.count-ov small { font-size: 1rem; font-weight: 700; }
@keyframes countPop { from { transform: scale(1.7); opacity: 0; } 35% { transform: scale(1); opacity: 1; } }
/* 가방 싸기: 가방이 위에 붙어 있고 아래 물건 목록만 움직임. 가방 높이는 화면의 3분의 1쯤으로 */
.packtop .bag, .packtop .pocket { max-width: min(420px, calc(34vh * var(--br, 1.2))); }
.packtop .msg { min-height: 0; margin: 0; text-align: center; }
.packtop .msg:empty { display: none; }
/* 가방 싸기: 한 화면에 맞춤(페이지 스크롤 없음) — 위 무게·타이머 줄 양끝에 작은 처음으로·소리, 가방 오른쪽에 세로 '다 쌌어요', 아래 물건 칸은 남은 높이만큼 */
body.in-game.packing { height: 100dvh; overflow: hidden; box-sizing: border-box; padding-top: calc(4px + env(safe-area-inset-top, 0px)) !important; padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px)) !important; }
body.in-game.packing::before { height: env(safe-area-inset-top, 0px); }
body.packing #app { height: 100%; gap: 6px; }
body.packing .packtop { position: static; padding-block: 2px 6px; }
body.packing .packtop .meters { padding-inline: 44px; min-height: 34px; }
body.packing #nav-home, body.packing #sound-fab { top: calc(4px + env(safe-area-inset-top, 0px)); min-height: 34px; height: 34px; min-width: 34px; padding: 0 9px; box-shadow: none; }
body.packing #nav-home:not(.confirm) .nh-tx { display: none; }
.pack-mid { display: grid; grid-template-columns: minmax(0, 1fr) 62px; gap: 8px; align-items: stretch; }
.pack-bag { display: grid; gap: 4px; min-width: 0; }
.pack-done { width: 100%; height: 100%; min-height: 0; padding: 8px 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 1.05rem; line-height: 1.25; flex: none; align-self: stretch; }
.pack-done b { font-size: 1.1rem; }
body.packing .pack-hint { margin: 0; font-size: .72rem; }
body.packing .furn-list { flex: 1; min-height: 0; display: flex; flex-direction: column; }
body.packing .furn-items { flex: 1 1 0; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-auto-rows: max-content; gap: 6px; padding: 6px; }
/* 카드는 grid로(아이폰에서 flex 버튼이 눌려 글자가 넘치던 것) */
body.packing .furn-items .item-card { display: grid; justify-items: center; align-content: start; text-align: center; gap: 1px; min-height: 0; height: auto; padding: 5px 3px; }
body.packing .furn-items .item-card .emo { font-size: 1.5rem; line-height: 1.15; }
body.packing .furn-items .item-card .name { font-size: .74rem; line-height: 1.2; }
body.packing .furn-items .item-card .size { font-size: .64rem; }
body.packing .rooms { gap: 4px; }
body.packing .room-tab { padding: 5px 2px; min-height: 0; display: flex; justify-content: center; align-items: center; gap: 3px; font-size: .76rem; white-space: nowrap; }
body.packing .room-tab .emo { font-size: 1rem; }
body.packing .furn-tab { min-height: 0; padding: 5px 4px; font-size: .76rem; }
body.packing .furn-tabs + .furn-items { min-height: 0; }
body.packing .furn-list { position: relative; }
body.packing .furn-list.more::after { content: "↓ 아래에 더 있어요"; position: absolute; left: 50%; bottom: 6px; transform: translateX(-50%); pointer-events: none;
  font-size: .74rem; font-weight: 700; color: var(--bg); background: var(--accent); border-radius: 99px; padding: 3px 10px; box-shadow: 0 2px 8px rgba(0,0,0,.35); animation: moreBob 1.6s ease-in-out infinite; }
@keyframes moreBob { 0%, 100% { transform: translateX(-50%); } 50% { transform: translate(-50%, 4px); } }
body.packing .furn-list.more::before { content: ""; position: absolute; left: 2px; right: 2px; bottom: 2px; height: 34px; pointer-events: none; border-radius: 0 0 12px 12px;
  background: linear-gradient(to bottom, transparent, var(--bg)); z-index: 1; }
body.packing .furn-list.more::after { z-index: 2; }
@media (prefers-reduced-motion: reduce) { body.packing .furn-list.more::after { animation: none; } }
body.packing .packtop .note { font-size: .72rem; margin: 0; }
body.packing .pslot .rot { font-size: 1.3rem; }
body.packing .msg { font-size: .8rem; }
@media (max-height: 520px) { .packtop { position: static; } }
/* 체력바: 조금 굵게, 깎이면 떨림 + 붉은 번쩍 */
.hpm { position: relative; }
.hpm .track { height: 12px; border-radius: 6px; }
.hpm .track { position: relative; }
.hpm .fill { position: relative; transition: width .6s cubic-bezier(.2,.7,.2,1); }
.hpm .ghost { position: absolute; left: 0; top: 0; height: 100%; border-radius: 6px; background: var(--good); opacity: .45; transition: width .9s ease-in .25s; }
.hpm .ghost.warn { background: var(--mid); }
.hpm .ghost.over { background: var(--bad); }
.hpm.hurt { animation: hpShake .45s; }
.hpm.hurt .track { box-shadow: 0 0 0 2px var(--bad); }
.hpm.hurt .hpnum { color: var(--bad); }
.hpm.healed .track { box-shadow: 0 0 0 2px var(--good); }
@keyframes hpShake { 15% { transform: translateX(-5px); } 30% { transform: translateX(5px); } 45% { transform: translateX(-4px); } 60% { transform: translateX(4px); } 80% { transform: translateX(-2px); } }
.hp-drop { position: absolute; right: 0; top: 100%; font-weight: 900; font-size: 1.05rem; color: var(--bad); pointer-events: none; animation: hpDrop 1.1s ease-out forwards; }
@keyframes hpDrop { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(18px); } }
.hurt-flash { position: fixed; inset: 0; z-index: 65; pointer-events: none; box-shadow: inset 0 0 70px 18px rgba(200,40,40,.55); animation: hurtFlash .5s ease-out forwards; }
@keyframes hurtFlash { from { opacity: 1; } to { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .hpm.hurt, .timer.hurry, .count-ov span { animation: none; } }

/* 버튼 */
.choice {
  width: 100%; text-align: left; font: inherit; color: var(--fg);
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px;
  padding: 16px; cursor: pointer; display: flex; gap: 12px; align-items: flex-start;
}
.choice:hover:not(:disabled) { border-color: var(--accent); }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.choice .key { font-family: var(--font-display); color: var(--accent); min-width: 1.2em; }
.choice small { display: block; color: var(--muted); font-size: .82rem; }
.choice small.danger { color: var(--bad); font-weight: 700; }
.choice:disabled { cursor: not-allowed; opacity: .5; border-style: dashed; background: transparent; }
.btn {
  font: inherit; font-weight: 700; border: 0; border-radius: 12px; padding: 16px 20px; cursor: pointer;
  background: var(--fg); color: var(--bg);
}
.btn.ghost { background: transparent; color: var(--fg); border: 1.5px solid var(--line); }
.btn.small { padding: 8px 14px; font-size: .9rem; }
.groups, .options { display: grid; gap: 10px; }
.groups.row { grid-template-columns: repeat(3, 1fr); gap: 8px; }
.groups.row.two { grid-template-columns: 1fr 1fr; }
.group-btn.on { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 2px var(--accent); }
.group-btn { flex-direction: column; align-items: center; justify-content: flex-start; text-align: center; gap: 2px; padding: 12px 6px; min-width: 0; }
.group-btn .g-emo { font-size: 1.6rem; line-height: 1.2; }
.group-btn strong { font-size: .95rem; word-break: keep-all; }
.group-btn small { font-size: .72rem; line-height: 1.3; word-break: keep-all; }

/* 상황 카드 */
.progress { display: flex; justify-content: space-between; align-items: center; font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.stage { font-weight: 700; font-size: .9rem; color: var(--accent); font-variant-numeric: tabular-nums; }
.alert-card { background: var(--alert-soft); border-left: 4px solid var(--alert); border-radius: 4px 12px 12px 4px; padding: 16px; display: grid; gap: 6px; }
.alert-card .head { color: var(--alert); font-weight: 700; font-size: .85rem; letter-spacing: .04em; }
.siren-tag { display: inline-flex; gap: 8px; align-items: center; font-size: .9rem; color: var(--muted); }
.story { font-size: 1.05rem; }
.cut { display: flex; align-items: center; justify-content: center; gap: 10px; background: var(--alert-soft); border-radius: 16px; padding: 12px 14px; }
.cut .emo { font-size: 2rem; letter-spacing: .15em; line-height: 1.2; }
.cut .bubble { position: relative; background: #fff; color: #222; font-weight: 700; font-size: .9rem; padding: 6px 10px; border-radius: 12px; white-space: nowrap; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
.cut .bubble::before { content: ""; position: absolute; left: -6px; top: 50%; margin-top: -6px; border: 6px solid transparent; border-right-color: #fff; border-left: 0; }
.mini-art { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 12px; image-rendering: pixelated; }
.ep-art { display: block; width: 100%; max-width: 420px; margin: 0 auto; aspect-ratio: 1; object-fit: cover; border-radius: 16px; }   /* 웹툰 컷처럼 1:1 */
.thought { font-style: italic; color: var(--muted); border-left: 3px solid var(--line); padding-left: 12px; }
.notice { font-size: .92rem; font-weight: 700; padding: 8px 12px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); }
.notice.down { color: var(--bad); } .notice.up { color: var(--good); }
.status-bar { display: flex; justify-content: space-between; font-size: .8rem; font-weight: 700; color: var(--alert); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; }
.feed { display: flex; flex-direction: column; gap: 28px; }
.feed-block { display: flex; flex-direction: column; gap: 16px; }
.feed-block + .feed-block { border-top: 1px dashed var(--line); padding-top: 28px; }
.feed-block .outcome { scroll-margin-top: 120px; animation: dissolve 1.1s ease both; }
.feed-block .rewind-inline { animation: dissolve 1s ease .35s both; }
.feed-next.nav-primary.highlight { animation: dissolve 1s ease .35s both, nudge 1.2s ease-in-out 1.4s 3; }
.mini.mini-res { animation: dissolve 1.1s ease both; }
@keyframes dissolve { from { opacity: 0; } to { opacity: 1; } }
.reveal { opacity: 0; transform: translateY(18px); transition: opacity 1s ease, transform 1s ease; }
.reveal.shown { opacity: 1; transform: none; }
/* 결과 바로 아래의 다음 장면: 결과를 읽을 틈을 주고 천천히 떠오름 */
.feed-block.done + .feed-block.reveal { transition-duration: 1.8s; transition-delay: .5s; }
.scroll-hint { text-align: center; font-size: .85rem; color: var(--muted); opacity: .55; margin: 4px 0 0; animation: hintBob 1.8s ease-in-out 3; }
@keyframes hintBob { 50% { transform: translateY(4px); } }
@media (prefers-reduced-motion: reduce) {
  .reveal { transition: none; transform: none; }
  .feed-block .outcome, .feed-block .rewind-inline, .feed-next.nav-primary.highlight, .mini.mini-res, .scroll-hint { animation: none; }
}
.feed-next { align-self: stretch; min-height: 52px; font-size: 1.05rem; }
/* 아래 바에 다음 버튼이 없을 때: 다시 하기·처음으로를 넓게 */
.bottombar-inner:not(:has(.nav-primary:not([hidden]))) .nav-btn:not(#sound-fab) { flex: 1; }
.mini-layer { position: fixed; inset: 0; z-index: 15; background: var(--bg); overflow-y: auto;
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(96px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
body.mini-open { overflow: hidden; }

  border-radius: 12px; padding: 12px 14px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 8px;
}
.furn.open { border-color: var(--accent); border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
.furn .hint { font-size: .8rem; color: var(--muted); }
.furn-items { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; padding: 10px; border: 1.5px solid var(--accent); border-top: 0; border-radius: 0 0 12px 12px; margin-top: -8px; }
.item-card {
  font: inherit; color: var(--fg); background: var(--bg); border: 1.5px solid var(--line); border-radius: 12px;
  padding: 8px 10px; cursor: pointer; display: flex; gap: 10px; align-items: center; text-align: left; min-width: 0;
}
.item-card:hover:not(:disabled) { border-color: var(--accent); }
.item-card:disabled { opacity: .5; cursor: default; }
.item-card .emo { font-size: 1.5rem; flex: none; }
.item-card .name { font-size: .88rem; font-weight: 700; line-height: 1.3; display: block; }
.furn-items .item-card { min-height: 66px; }
.bundle-card.pick { cursor: default; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 6px; border-color: var(--accent); align-items: stretch; }
.bundle-card.pick button { font: inherit; font-size: .86rem; font-weight: 700; color: var(--fg); background: var(--surface); border: 1.5px solid var(--line); border-radius: 8px; padding: 4px 2px; cursor: pointer; display: grid; align-content: center; justify-items: center; gap: 1px; min-width: 0; white-space: nowrap; }
.bundle-card.pick button small { font-size: .68rem; font-weight: 500; color: inherit; opacity: .75; }
.bundle-card.pick .bb-unit { background: var(--accent); border-color: var(--accent); color: #1d211b; }
.bundle-card.pick button:disabled { opacity: .45; cursor: default; }
.bundle-pick { grid-column: 1 / -1; display: grid; gap: 8px; background: var(--surface); border: 1.5px solid var(--accent); border-radius: 12px; padding: 10px; }
.bundle-pick button { font: inherit; border-radius: 12px; border: 1.5px solid var(--line); background: var(--bg); color: var(--fg); cursor: pointer; padding: 8px 10px; }
.bundle-pick button:disabled { opacity: .45; cursor: default; }
.bundle-pick small { color: var(--muted); font-size: .75rem; margin-left: 4px; }
.bp-whole { text-align: left; font-weight: 700; }
.bp-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: .9rem; }
.bp-row strong { min-width: 2.6em; text-align: center; font-variant-numeric: tabular-nums; }
.bp-step { width: 36px; height: 36px; padding: 0 !important; font-size: 1.1rem !important; }
.bp-units { margin-left: auto; font-weight: 700; background: var(--accent) !important; color: #1d211b !important; border-color: var(--accent) !important; }
.bundle-pick .note { margin: 0; }
.item-card .size { font-size: .75rem; color: var(--muted); font-variant-numeric: tabular-nums; }

/* 가방 */
.bag {
  display: grid; width: 100%; max-width: 420px; margin-inline: auto; gap: 2px; padding: 6px;
  background: var(--bag); border-radius: 16px;
}
.cell { border-radius: 4px; background: var(--bag-cell); min-width: 0; }
.placed { position: relative; z-index: 2; min-width: 0; min-height: 0; }
.placed .rot {
  width: 100%; height: 100%; border: 0; border-radius: 8px; background: var(--item); color: var(--item-fg);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  font: inherit; font-size: .68rem; line-height: 1.15; text-align: center; padding: 2px; cursor: pointer; overflow: hidden;
  box-shadow: inset 0 0 0 1.5px rgba(0,0,0,.18);
}
.placed .rot .emo { font-size: 1.15rem; }
.placed .rot .nm { font-size: .56rem; font-weight: 700; line-height: 1.08; letter-spacing: -.04em; word-break: break-all; max-width: 100%; overflow: hidden; }
.placed .rot:has(.nm) .emo { font-size: .95rem; line-height: 1.1; }
.pslot .rot { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; line-height: 1.1; overflow: hidden; }
.pslot .rot .nm { font-size: .56rem; font-weight: 700; letter-spacing: -.04em; white-space: nowrap; max-width: 100%; overflow: hidden; }
.placed .uses { position: absolute; bottom: 3px; right: 5px; font-size: .7rem; font-weight: 700; color: var(--item-fg); }
.placed .del {
  position: absolute; top: -6px; right: -6px; width: 19px; height: 19px; border-radius: 50%;
  border: 0; background: var(--alert); color: #fff; font-size: .75rem; line-height: 1; cursor: pointer; padding: 0;
}
.bag.view .rot { cursor: default; }
.bag.edit { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.bag.edit .rot { touch-action: none; cursor: grab; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.drag-ghost { position: fixed; z-index: 50; pointer-events: none; opacity: .85; transform: scale(1.05); box-shadow: 0 8px 20px rgba(0,0,0,.35) !important; }
.placed.dragging { opacity: .45; }
.cell.pv-ok { background: var(--good); }
.cell.pv-no { background: var(--bad); }
.pocket { display: grid; gap: 4px; align-items: center; max-width: 420px; width: 100%; margin-inline: auto; background: var(--bag); border-radius: 12px; padding: 6px; }
.pocket .plabel { color: #e6e9dd; font-size: .72rem; font-weight: 700; padding-inline: 4px; line-height: 1.2; }
.pslot { position: relative; aspect-ratio: 1; border-radius: 8px; background: var(--bag-cell); min-width: 0; }
.pslot .rot { width: 100%; height: 100%; border: 0; border-radius: 8px; background: var(--item); color: var(--item-fg); font-size: 1.3rem; cursor: pointer; padding: 0; }
.pslot .del { position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; border-radius: 50%; border: 0; background: var(--alert); color: #fff; font-size: .7rem; cursor: pointer; padding: 0; }
.socials { display: grid; gap: 10px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; padding: 16px; }
.creator { display: flex; align-items: center; gap: 12px; }
.creator img { width: 52px; height: 52px; border-radius: 50%; flex: none; object-fit: cover; }
.creator strong { display: block; font-size: 1.05rem; }
.social-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.social-btn { display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 700; font-size: .92rem; text-decoration: none; color: var(--fg); border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 8px; background: var(--bg); }
.social-btn:hover { border-color: var(--accent); }
.social-btn svg { width: 24px; height: 24px; flex: none; }
.credit { font-size: .8rem; color: var(--muted); text-align: center; }
.siren-card { background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px; }
.siren-card-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.siren-svg { width: 100%; height: auto; display: block; }

/* 소리 버튼 (항상 화면 오른쪽 아래) */
.sound-fab {
  position: fixed; z-index: 20;
  right: calc(12px + env(safe-area-inset-right, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  font: inherit; font-size: .85rem; font-weight: 700; border: 1.5px solid var(--line); border-radius: 99px;
  padding: 8px 14px; background: var(--surface); color: var(--fg); cursor: pointer; box-shadow: 0 4px 12px rgba(0,0,0,.15);
}
.toggles { display: grid; gap: 8px; }
.toggle-row {
  display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%;
  font: inherit; color: var(--fg); background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer; text-align: left;
}
.toggle-row.on { border-color: var(--accent); background: var(--accent-soft); }
.toggle-row small { display: block; color: var(--muted); font-size: .8rem; }
.switch { flex: none; width: 44px; height: 26px; border-radius: 13px; background: var(--line); position: relative; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--surface); transition: left .2s; }
.toggle-row.on .switch { background: var(--accent); }
.toggle-row.on .switch::after { left: 21px; }
.hard-tag { display: inline-block; font-size: .72rem; font-weight: 700; color: #fff; background: var(--alert); border-radius: 99px; padding: 1px 8px; vertical-align: middle; }

/* 공유 · 기록 */
.share-box, .save-box, .stats-box { background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 10px; }
.loc-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.loc-btn { font: inherit; color: var(--fg); background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 8px; cursor: pointer; display: grid; gap: 2px; text-align: center; min-width: 0; }
.loc-btn small { font-size: .74rem; color: var(--muted); line-height: 1.3; }
.loc-btn.on { border-color: var(--accent); background: var(--accent-soft); }
/* 결과 페이지 접이식 섹션 */
details.sec { background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; }
details.sec > summary {
  list-style: none; cursor: pointer; padding: 16px; display: flex; justify-content: space-between; align-items: center; gap: 10px;
  font-weight: 700; font-size: 1rem;
}
details.sec > summary::-webkit-details-marker { display: none; }
details.sec > summary::after { content: "▾"; color: var(--muted); transition: transform .2s; }
details.sec[open] > summary::after { transform: rotate(180deg); }
details.sec > summary .sec-sub { margin-left: auto; font-size: .8rem; font-weight: 500; color: var(--muted); }
details.sec > summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 16px; }
details.sec[open] { padding-bottom: 14px; }
details.sec > *:not(summary) { margin-inline: 14px; }
details.sec > * + *:not(summary) { margin-top: 10px; }
@media (prefers-reduced-motion: reduce) { details.sec > summary::after { transition: none; } }
.pack-hint { text-align: center; }
.fold-btn {
  display: block; width: calc(100% - 28px); font: inherit; font-size: .88rem; font-weight: 700; color: var(--muted);
  background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 10px; cursor: pointer;
}
.fold-btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
details.sec > summary { scroll-margin-top: 12px; }
.toast {
  position: fixed; left: 50%; transform: translate(-50%, 8px); z-index: 30; opacity: 0;
  bottom: calc(76px + env(safe-area-inset-bottom, 0px)); width: min(92vw, 520px);
  background: var(--fg); color: var(--bg); border-radius: 12px; padding: 12px 14px;
  font-size: .92rem; font-weight: 700; line-height: 1.45; box-shadow: 0 6px 20px rgba(0,0,0,.25);
  transition: opacity .2s, transform .2s; pointer-events: none;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
/* 가방 싸기: 자리 없음 등은 위 타이머 줄 바로 아래에 잠깐(가방·물건 칸을 안 가리게) */
body.packing .toast { top: calc(40px + env(safe-area-inset-top, 0px)); bottom: auto; font-size: .82rem; padding: 8px 12px; width: min(86vw, 420px); }
.toast.ok { border-left: 5px solid var(--good); }
.toast.bad { border-left: 5px solid var(--bad); }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
.toggle-row.locked { opacity: .6; cursor: default; border-style: dashed; }
.res-main, .res-panel { display: grid; gap: 16px; }
.res-main[hidden], .res-panel[hidden], .share-img[hidden] { display: none; }
.res-split { justify-content: center; font-size: .85rem; }
.panel-head { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; display: flex; align-items: center; gap: 10px;
  margin: -6px -16px 0; padding: 8px 16px; background: var(--bg); border-bottom: 1px solid var(--line); }
.panel-back { flex: none; width: 40px; height: 40px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface); color: var(--fg);
  font: inherit; font-size: 1.25rem; font-weight: 700; line-height: 1; cursor: pointer; display: grid; place-items: center; padding: 0; }
.panel-back:hover { border-color: var(--accent); }
.panel-title { margin: 0; font-size: 1.1rem; min-width: 0; }
.score-sum { display: flex; align-items: center; gap: 2px; padding: 10px 6px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); }
.score-sum > span { flex: 1 1 0; min-width: 0; display: grid; justify-items: center; font-size: 1.2rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.2; }
.score-help { margin: 4px 0 0; font-size: .7rem; color: var(--muted); text-align: center; word-break: keep-all; }
.prep-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.prep-list > li { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.prep-list > li > span { font-size: 1.5rem; flex: none; }
.prep-list > li > div { display: grid; gap: 2px; min-width: 0; }
.prep-list small { color: var(--muted); font-size: .78rem; word-break: keep-all; }
.prep-list > li.open-li { display: block; }
.prep-list > li.open-li summary { display: flex; gap: 10px; align-items: center; cursor: pointer; list-style: none; }
.prep-list > li.open-li summary::-webkit-details-marker { display: none; }
.prep-list > li.open-li summary::after { content: "▾"; margin-left: auto; color: var(--muted); transition: transform .2s; }
.prep-list > li.open-li details[open] summary::after { transform: rotate(180deg); }
.prep-list > li.open-li summary > span { font-size: 1.5rem; flex: none; }
.prep-list > li.open-li summary > div { display: grid; gap: 2px; min-width: 0; }
.prep-list > li.open-li details[open] summary { padding-bottom: 8px; margin-bottom: 8px; border-bottom: 1px solid var(--line); }
.score-sum b { font-size: .68rem; color: var(--muted); font-weight: 700; white-space: nowrap; }
.score-sum small { font-size: .7rem; color: var(--muted); }
.score-sum i { font-style: normal; font-size: .62rem; color: var(--muted); font-weight: 400; word-break: keep-all; text-align: center; max-width: 72px; }
.score-sum em { font-style: normal; color: var(--muted); font-weight: 700; }
.score-sum .total { color: var(--accent); }
.score-sum .total b { color: var(--accent); }
.score-sum .minus { color: var(--bad); }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tile { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 12px 4px; min-width: 0;
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; color: var(--fg); font: inherit; cursor: pointer; }
.tile:hover { border-color: var(--accent); }
.tile .t-emo { font-size: 1.6rem; line-height: 1.2; }
.tile .t-name { font-size: .85rem; font-weight: 700; word-break: keep-all; text-align: center; }
.tile .t-sub { font-size: .72rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.tile.warn { border-color: var(--bad); }
.urgent { display: flex; align-items: center; gap: 8px; font-size: .85rem; font-weight: 700; color: var(--alert); }
.urgent b { font-family: var(--font-display); font-size: 1.3rem; font-variant-numeric: tabular-nums; }
.urgent .track { flex: 1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.urgent .track i { display: block; height: 100%; background: var(--alert); transition: width .1s linear; }
.mini { display: grid; gap: 12px; justify-items: center; text-align: center; padding: 8px 0 24px; }
.mini-tag { font-weight: 700; color: var(--accent); font-size: .9rem; margin: 0; }
.mini-how { font-size: .95rem; margin: 0; }
.mini-start { min-width: 160px; font-size: 1.1rem; }
.mini .nav-primary.mini-start, .inline-go { width: 100%; min-height: 52px; font-size: 1.05rem; flex: none; }
.mini-intro { background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; padding: 16px; }
.picked-line { margin: 0; font-weight: 700; }
.heal-btn { border-color: var(--accent) !important; background: var(--accent-soft) !important; animation: healGlow 2.8s ease-in-out 3; text-align: left; }
@keyframes healGlow { 50% { box-shadow: 0 0 0 4px var(--accent-soft); } }
.heal-btn .heal-tag { display: inline-block; margin-right: 6px; padding: 1px 8px; border-radius: 99px; background: var(--accent); color: #1d211b; font-size: .72rem; font-weight: 800; vertical-align: 1px; }
.heal-btn .heal-tap { display: block; margin-top: 4px; font-size: .78rem; color: var(--accent); font-weight: 700; }
@media (prefers-reduced-motion: reduce) { .heal-btn { animation: none; } }
.mini-live { font-size: .9rem; color: var(--muted); margin: 0; font-variant-numeric: tabular-nums; }
.mini-live b { color: var(--fg); }
.mini-live b.good { color: var(--good); } .mini-live b.bad { color: var(--bad); }
.mini-big { font-family: var(--font-display); font-size: 2rem; margin: 0; line-height: 1.2; }
.mini-big span { display: block; font-family: var(--font-body); font-size: 1rem; color: var(--muted); }
.mini-big.good { color: var(--good); } .mini-big.mid { color: var(--mid); } .mini-big.bad { color: var(--bad); }
.mini-log { font-size: .85rem; font-weight: 700; margin: 0; }
.cpr-wrap { position: relative; width: 220px; height: 220px; display: grid; place-items: center; }
.cpr-guide { position: absolute; inset: 0; pointer-events: none; border-radius: 50%; border: 4px solid var(--accent); opacity: .5; animation: cprbeat .545s ease-out infinite; }
@keyframes cprbeat { 0% { transform: scale(.78); opacity: .8; } 100% { transform: scale(1); opacity: 0; } }
.cpr-heart { width: 150px; height: 150px; border-radius: 50%; border: 0; background: var(--surface); font-size: 4.2rem; cursor: pointer;
  box-shadow: 0 6px 18px rgba(0,0,0,.18); touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
.cpr-heart.push { animation: cprpush .14s ease-out; }
@keyframes cprpush { 50% { transform: scale(.88); } }
.wound-area { position: relative; width: 100%; max-width: 340px; height: 220px; border-radius: 16px; background: #e9c9a8; overflow: hidden; touch-action: none; }
.wound-area .arm { position: absolute; inset: 0; display: grid; place-items: center; font-size: 7rem; opacity: .35; pointer-events: none; }
.wound { position: absolute; transform: translate(-50%, -50%); border-radius: 50%; border: 3px dashed var(--bad); background: rgba(200,40,40,.25);
  font-size: 1.6rem; cursor: pointer; touch-action: none; -webkit-user-select: none; user-select: none; animation: bleedpulse 1s ease-in-out infinite; }
.wound.pressed { background: rgba(255,255,255,.75); border-style: solid; border-color: var(--good); animation: none; }
@keyframes bleedpulse { 50% { box-shadow: 0 0 0 10px rgba(200,40,40,.2); } }
.hold-bar { width: 100%; max-width: 340px; height: 12px; background: var(--line); border-radius: 8px; overflow: hidden; }
.hold-bar i { display: block; height: 100%; width: 0; background: var(--good); }
.fire { border: 0; background: none; line-height: 1; cursor: default; padding: 0; transition: font-size .2s; touch-action: manipulation; }
.fire.live { cursor: pointer; animation: firewobble .5s ease-in-out infinite; }
@keyframes firewobble { 50% { transform: rotate(-4deg) scale(1.05); } }
.fire-steps { display: grid; gap: 8px; width: 100%; }
.fire-step { justify-content: center; text-align: center; }
.fire-step.done { opacity: .45; border-style: solid; border-color: var(--good); }
.fire-step.shake { animation: shake .35s; border-color: var(--bad); }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
@media (prefers-reduced-motion: reduce) { .cpr-guide { animation-duration: .545s; } .wound, .fire.live { animation: none; } }
.rd-face { display: grid; gap: 4px; justify-items: center; width: 100%; max-width: 300px; padding: 16px; border-radius: 16px; background: #222; color: #eee; }
.rd-face b { font-family: var(--font-display); font-size: 2.2rem; color: #ffb648; font-variant-numeric: tabular-nums; letter-spacing: .03em; }
.rd-face span { font-size: .85rem; min-height: 1.3em; color: #aaa; }
.rd-face span.good { color: #7ddc8a; font-weight: 700; }
.rd-dial { width: 100%; max-width: 300px; accent-color: var(--accent); height: 32px; }
.rd-fine { display: flex; gap: 8px; }
.rd-lines { display: grid; gap: 8px; width: 100%; }
.rd-line { text-align: left; font-size: .9rem; }
.door { --gap: 0%; position: relative; width: 200px; height: 150px; border-radius: 12px; background: #111 linear-gradient(#333, #111); overflow: hidden; }
.door i { position: absolute; top: 0; bottom: 0; width: 50%; background: #9aa3ad; border: 2px solid #6d757e; transition: transform .2s; }
.door .dl { left: 0; transform: translateX(calc(var(--gap) * -0.8)); }
.door .dr { right: 0; transform: translateX(calc(var(--gap) * 0.8)); }
.sg-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
.sg-card { display: grid; justify-items: center; align-content: center; gap: 4px; min-height: 120px; padding: 10px 6px; border-radius: 12px;
  border: 2px solid var(--line); background: var(--surface); color: var(--fg); font: inherit; cursor: pointer; touch-action: manipulation; }
.sg-card b { font-size: .9rem; word-break: keep-all; line-height: 1.25; }
.sg-card small { font-size: .7rem; color: var(--muted); }
.sg-card .sg-emo { font-size: 2.2rem; line-height: 1; }
.sg-card.exit { background: #1f8a4c; color: #fff; border-color: #1f8a4c; } .sg-card.exit small { color: #e0ffe9; }
.sg-mark { width: 44px; height: 44px; border-radius: 50%; background: #f28c28; display: grid; place-items: center; }

.sg-card.right { border-color: var(--good); box-shadow: 0 0 0 3px var(--good); }

.achv-new { background: var(--accent-soft); border: 2px solid var(--accent); border-radius: 12px; padding: 12px 14px; font-size: .95rem; }

.rewind-btn { justify-self: start; font: inherit; font-size: .82rem; font-weight: 700; color: var(--accent); background: none; border: 1.5px dashed var(--accent); border-radius: 99px; padding: 6px 12px; cursor: pointer; }
.rewind-inline { justify-self: start; }
.result-trio { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.trio { background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; padding: 12px 8px; display: grid; gap: 2px; text-align: center; min-width: 0; }

.nick-row input { flex: 1; min-width: 0; font: inherit; font-weight: 400; color: var(--fg); background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.type-card { background: var(--surface); border: 2px solid var(--accent); border-radius: 16px; padding: 16px; display: grid; gap: 6px; }

.trait-row { display: flex; flex-wrap: wrap; gap: 6px; }

.loot-list { display: grid; gap: 6px; }
.loot-item {
  display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%;
  font: inherit; font-size: .92rem; color: var(--fg); background: var(--surface); border: 1.5px solid var(--accent);
  border-radius: 12px; padding: 10px 12px; cursor: pointer; text-align: left; min-height: 44px;
}
.loot-item strong { color: var(--accent); white-space: nowrap; }
.loot-item.done { border-color: var(--good); cursor: default; }

/* 가방 꺼내 쓰기: 선택지(A·B·C)와 다른 모양으로, 줄 하나로 떼어 놓음 */
.or-line { display: flex; align-items: center; gap: 10px; margin: 6px 0 0; font-size: .78rem; font-weight: 700; color: var(--muted); }
.or-line::before, .or-line::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.tool-open { width: 100%; font: inherit; color: var(--fg); background: none; border: 1.5px dashed var(--accent); border-radius: 999px; padding: 9px 16px; cursor: pointer; display: flex; align-items: center; gap: 10px; text-align: left; min-height: 44px; }
.tool-open .key { font-size: 1.15rem; flex: none; }

.fb-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.fb-tab { font: inherit; font-weight: 700; color: var(--fg); background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 10px; cursor: pointer; min-height: 44px; }

.notice-in { margin: 6px 0 0; padding-top: 6px; border-top: 1px dashed var(--line); font-size: .92rem; }

.delta small { font-weight: 500; opacity: .8; }
/* 긴 상황 글 접기 */
.story.clamp { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; }
.more-btn { font: inherit; font-size: .82rem; font-weight: 700; color: var(--accent); background: none; border: 0; padding: 2px 0 6px; cursor: pointer; justify-self: start; text-align: left; }
.tool-choice { border-color: var(--accent); border-style: dashed; }

.tool-choice.open { background: var(--accent-soft); border-style: solid; }
.picker { background: var(--accent-soft); border-radius: 12px; padding: 10px 12px; display: grid; gap: 8px; margin-top: -4px; }
.picker .chip { background: var(--surface); color: var(--fg); border: 1.5px solid var(--line); min-height: 40px; }
.heal-btn {
  width: 100%; font: inherit; font-size: .92rem; font-weight: 700; color: var(--fg); background: var(--surface);
  border: 1.5px solid var(--good); border-radius: 12px; padding: 10px 12px; cursor: pointer; text-align: left; min-height: 44px;
}
.heal-btn strong { color: var(--good); float: right; }
.heal-hint { font-size: .85rem; color: var(--bad); font-weight: 700; }
.announce { font-size: .95rem; background: var(--surface); border: 1px dashed var(--line); border-radius: 8px; padding: 8px 12px; }
.disclaimer { font-size: .9rem; background: var(--accent-soft); border-radius: 12px; padding: 10px 12px; }
.nav-primary.highlight { background: var(--accent); color: #1d211b; box-shadow: 0 0 0 3px var(--accent-soft); animation: nudge 1.2s ease-in-out 3; }
@keyframes nudge { 50% { box-shadow: 0 0 0 7px var(--accent-soft); } }
@media (prefers-reduced-motion: reduce) { .nav-primary.highlight { animation: none; } }
.law-box { background: var(--accent-soft); border-left: 4px solid var(--accent); border-radius: 4px 12px 12px 4px; padding: 16px; display: grid; gap: 6px; }
.law-box ul { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; font-size: .92rem; }
.tool-box { background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 10px; }
.tool-field { display: grid; grid-template-columns: 3.5em 1fr; align-items: center; gap: 8px; font-weight: 700; font-size: .9rem; }
.tool-field select, .tool-field input { min-width: 0; font: inherit; font-weight: 400; color: var(--fg); background: var(--bg); border: 1.5px solid var(--line); border-radius: 12px; padding: 8px 10px; }
.tool-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }

button.social-btn { font: inherit; font-weight: 700; cursor: pointer; }

.share-img { display: block; width: 100%; max-width: 480px; justify-self: center; margin: 0 auto; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); aspect-ratio: 1080 / 1350; box-shadow: 0 10px 30px rgba(0,0,0,.3); }
.share-box textarea { width: 100%; min-height: 90px; font: inherit; font-size: .88rem; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px; resize: vertical; }

.bars { display: grid; gap: 6px; padding: 0; margin: 0; list-style: none; }

/* 결과 */

.ending { background: var(--accent-soft); border-radius: 12px; padding: 16px; display: grid; gap: 6px; }

.fb-list, .item-list { display: grid; gap: 12px; padding: 0; margin: 0; list-style: none; }

/* ── 다듬기 ④ 첫 화면: 관련된 것끼리 묶고(안 8px), 묶음 사이는 넓게(24px) ── */

.tiles { grid-template-columns: repeat(12, 1fr); gap: 8px; }
.tile { grid-column: span 4; order: 2; padding: 12px 4px; border-width: 1px; border-radius: 12px; }

.tile[data-panel="feedback"] .t-name, .tile[data-panel="type"] .t-name { font-size: 1.05rem; text-align: left; }
.tile[data-panel="feedback"] .t-sub, .tile[data-panel="type"] .t-sub { font-size: .8rem; }
.tile[data-panel="prep"], .tile[data-panel="stats"], .tile[data-panel="sources"], .tile[data-panel="law"] { grid-column: span 3; order: 3; background: none; padding: 8px 2px; }
.tile[data-panel="prep"] .t-name, .tile[data-panel="stats"] .t-name, .tile[data-panel="sources"] .t-name, .tile[data-panel="law"] .t-name { font-size: .78rem; font-weight: 500; }
.tile[data-panel="prep"] .t-sub, .tile[data-panel="stats"] .t-sub, .tile[data-panel="sources"] .t-sub, .tile[data-panel="law"] .t-sub { font-size: .68rem; }
.tile.warn { border-color: var(--bad) !important; }
/* ── 다듬기 ① 가방: 칸 글자는 자간을 좁히지 않고 조금 크게, 빼기 버튼은 작고 차분하게 ── */
.bag { padding: 8px; }
.pocket { padding: 8px; }
.placed .rot { font-size: .7rem; }
.placed .rot .nm, .pslot .rot .nm { font-size: .6rem; font-weight: 600; letter-spacing: 0; }
.placed .del, .pslot .del { top: -4px; right: -4px; width: 18px; height: 18px; font-size: .62rem; background: rgba(29, 33, 27, .82); color: #fff; box-shadow: 0 0 0 1.5px var(--item); }
.pack-hint { font-size: .82rem; }
.placed .rot:has(.nm) .emo { font-size: .85rem; line-height: 1.15; }
.placed .rot .nm.wide { word-break: keep-all; }
/* ── 버전·버그 제보 ── */
.link-btn { font: inherit; font-size: .85rem; color: var(--muted); background: none; border: 0; padding: 8px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; justify-self: center; align-self: center; }
.link-btn:hover { color: var(--fg); }
.bug-form { display: grid; gap: 12px; }
.bug-form label { display: grid; gap: 4px; font-size: .9rem; font-weight: 700; }
.bug-form textarea, .bug-form input[type="file"] { font: inherit; font-weight: 400; color: var(--fg); background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px; width: 100%; }
.bug-form textarea { min-height: 140px; resize: vertical; }
.bug-form img { max-height: 240px; border-radius: 8px; border: 1px solid var(--line); justify-self: start; }
/* 플레이 뒤 짧은 설문 */
.survey { display: grid; gap: 12px; padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
.sv-title { margin: 0; font-weight: 800; text-align: center; }
.sv-title small, .sv-q small { font-weight: 400; color: var(--muted); }
.sv-stars { display: flex; justify-content: center; gap: 4px; }
.sv-star { font: inherit; font-size: 2rem; line-height: 1; width: 48px; height: 48px; color: var(--line); background: none; border: 0; padding: 0; cursor: pointer; }
.sv-star.on { color: var(--accent); }
.sv-more { display: grid; gap: 14px; }
.sv-more[hidden] { display: none; }
.sv-q { display: grid; gap: 6px; }
.sv-q p { margin: 0; font-size: .9rem; font-weight: 700; }
.sv-opts { display: flex; flex-wrap: wrap; gap: 6px; }
.sv-opt { font: inherit; font-size: .9rem; color: var(--fg); background: var(--bg); border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 14px; min-height: 44px; cursor: pointer; }

.survey textarea { width: 100%; min-height: 72px; font: inherit; font-size: .9rem; font-weight: 400; color: var(--fg); background: var(--bg); border: 1.5px solid var(--line); border-radius: 12px; padding: 10px; resize: vertical; box-sizing: border-box; }

details.sec > summary { word-break: keep-all; }
.type-past details.sec > summary { display: grid; grid-template-columns: 1fr auto; column-gap: 8px; row-gap: 2px; align-items: center; }
.type-past details.sec > summary > span:first-child { grid-column: 1; grid-row: 1; }

.pslot .rot { font-size: 1.7rem; }
/* 아래 물건 목록: 아이콘 크게, 설명(칸·무게)은 잘리지 않게 두 줄까지 */
.item-card .emo { font-size: 2rem; }
.item-card .size { white-space: normal; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; line-height: 1.3; }
/* 앱 안 브라우저(카카오톡 등)가 글자를 제멋대로 키우지 않게 */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
/* 화면을 끝에서 더 당겨도 위 칸(처음으로·소리·가방)이 끌려 내려가지 않게 */
html, body { overscroll-behavior: none; }
/* 아이폰은 16px보다 작은 입력칸을 누르면 화면을 저절로 확대함 → 입력칸 글자는 16px 이상 */
input, textarea, select { font-size: max(16px, 1em) !important; }
/* 내 유형 제목: 닉네임 한 줄, 유형 이름은 다음 줄에 (이름 길이와 상관없이 같은 자리) · 낱말 중간에서 안 끊김 */

function locPool(withLoot) {
  const ids = new Set(LOCS[startLoc].furn.flatMap(f => f.items));
  [...ids].forEach(id => { if (ITEM_BY_ID[id].bundle) ids.add(ITEM_BY_ID[id].bundle.unit); });   // 묶음에서 꺼낸 낱개
  ITEMS.filter(i => i.shop).forEach(i => ids.add(i.id));
  if (withLoot) scenes.forEach(s => (s.loot || []).forEach(l => { if (!l.loc || l.loc === startLoc) ids.add(l.id); }));
  return ids;
}

function poolItemFor(key) {
  const pool = locPool(true);
  if (pool.has(key)) return key;
  const cat = ITEM_BY_ID[key] ? ITEM_BY_ID[key].cat : key;
  return cat ? [...pool].find(id => ITEM_BY_ID[id].cat === cat && !ITEM_BY_ID[id].bundle) || [...pool].find(id => ITEM_BY_ID[id].cat === cat) || null : null;
}

function endingExtra(typeKey, ending, score) {
  const line = TYPE_END_GROUP[typeKey] && TYPE_END_GROUP[typeKey][ENDING_GROUP[ending]];
  const t = line || (TYPE_END[typeKey] ? TYPE_END[typeKey][ENDING_HARD.includes(ending) ? "hard" : "good"] : "");
  const s = score >= 90 ? "실제 상황이었어도 살아남았을 가능성이 아주 높다."
    : score >= 70 ? "아쉬운 순간 몇 번만 줄이면 완벽에 가깝다."
    : score >= 50 ? "살아남았지만, 운이 따라 준 순간도 많았다."
    : score >= 30 ? "다음엔 가방과 선택부터 다시 점검해 보자."
    : "실제였다면 무척 위험했다.";
  if (line && TYPES[typeKey]) return `${TYPES[typeKey].emo} <strong>${TYPES[typeKey].name}</strong> — ${t} <strong>생존율 ${score}%</strong> · ${s}`;
  return `${TYPES[typeKey] ? `${TYPES[typeKey].emo} <strong>${TYPES[typeKey].name}</strong>답게, ` : ""}${t} <strong>생존율 ${score}%</strong> · ${s}`;
}

      const edge = Math.min(1, at / 0.6, (total - at) / 0.9);            // 점점 커졌다 멀어짐
      const v = VOLUME * (1.6 + Math.random() * 2.6) * Math.max(0.15, edge);
      this.burst(at, .07 + Math.random() * .05, v, "lowpass", 170 + Math.random() * 230, .004);
      if (Math.random() < 0.3) this.burst(at, .03, v * .35, "bandpass", 1400 + Math.random() * 900, .003);   // 바닥을 차는 마찰음
    }

    // 소리 다듬기: 부드럽게 깎는 필터 → 볼륨 → (원음 + 메아리) → 전체 볼륨

      { type: "sawtooth", mult: 1,   gain: 0.5 },
      { type: "sawtooth", mult: 0.5, gain: 0.22 },
      { type: "square",   mult: 2,   gain: 0.07 }

      const o = ctx.createOscillator(), g = ctx.createGain();

      o.connect(g).connect(filter);
      o.start(t); o.stop(t + dur + 0.1);

    });

    setTimeout(() => { [env, delay, feedback, wet, filter].forEach(n => { try { n.disconnect(); } catch (e) {} }); }, (dur + 3) * 1000);

// 그림을 긴 쪽 720px 이하 JPEG로 줄여 글자(base64)로 바꿈. 너무 크면 한 번 더 줄임
function shrinkImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      if (!im.width || !im.height) { URL.revokeObjectURL(url); reject(new Error("img")); return; }
      const make = (max, q) => { const k = Math.min(1, max / Math.max(im.width, im.height)); const c = document.createElement("canvas"); c.width = Math.max(1, Math.round(im.width * k)); c.height = Math.max(1, Math.round(im.height * k)); c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); return c.toDataURL("image/jpeg", q); };
      let d = make(720, .6); if (d.length > 240000) d = make(560, .45); if (d.length > 240000) d = make(420, .4); if (d.length > 240000) d = make(300, .3);
      URL.revokeObjectURL(url); if (d.length > 240000) reject(new Error("big")); else resolve(d);
    };
    im.onerror = () => { URL.revokeObjectURL(url); reject(new Error("img")); };
    im.src = url;
  });
}

function sirenGraph(kind) {

  const maxT = kind === "steady" ? 60 : 56;

let hpShown = null;
function hpFx() {
  const els = [...document.querySelectorAll(".hpm:not([data-done])")];
  if (!els.length) return;
  const to = Number(els[els.length - 1].dataset.hp), from = hpShown;
  els.forEach(m => { m.dataset.done = "1"; });
  hpShown = to;
  if (from === null || from === to) return;
  els.forEach(m => {
    const fill = m.querySelector(".fill"), ghost = m.querySelector(".ghost"), num = m.querySelector(".hpnum");
    if (to < from) {   // 깎임: 옅은 막대가 예전 길이에서 천천히 따라옴
      ghost.style.transition = "none"; ghost.style.width = from + "%";
      fill.style.transition = "none"; fill.style.width = to + "%";
      void ghost.offsetWidth;
      ghost.style.transition = ""; ghost.style.width = to + "%";
      m.classList.add("hurt");
      const tag = document.createElement("span"); tag.className = "hp-drop"; tag.textContent = String(to - from); m.appendChild(tag);
    } else {           // 회복: 진한 막대가 차오름
      fill.style.transition = "none"; fill.style.width = from + "%";
      void fill.offsetWidth;
      fill.style.transition = ""; fill.style.width = to + "%";
      m.classList.add("healed");
    }
    const t0 = performance.now(), dur = 900;
    const step = now => {
      if (!num.isConnected) return;
      const k = Math.min(1, (now - t0) / dur);
      num.textContent = Math.round(from + (to - from) * k);
      if (k < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
  if (to < from) {
    const fl = document.createElement("div"); fl.className = "hurt-flash"; document.body.appendChild(fl);
    setTimeout(() => fl.remove(), 500);
    Sound.hurt();
  }
}

           <li><span class="ic ic-search"></span>부족한 물건은 <strong>게임을 하면서 주울 수 있어요</strong></li>`

      <li>🔄 <strong>가방 속 물건을 누르면</strong> 회전, <strong>누른 채로 끌면</strong> 자리를 옮겨요 · ✕로 빼요</li>
      <li>👛 신분증·현금 같은 <strong>작은 물건</strong>은 앞주머니(${POCKET_SLOTS}칸)에 먼저 들어가고, 꽉 차면 가방 본칸 1칸에 들어가요</li>

    <button class="nav-primary highlight inline-go" id="pack-go"><span class="ic ic-play"></span>가방 싸기 시작 (${PACK_SECONDS}초)</button>`;
}
function showHowTo() {
  app.innerHTML = howToInner();
  setNav({ game: true, back: true });
  document.getElementById("pack-go").addEventListener("click", startPacking);
  window.scrollTo(0, 0);
}

// ───────── 가방 싸기 ─────────
function startPacking() {
  if (LOCS[startLoc].carried) {   // 지하철: 가방 싸기 화면 없이 바로 출발
    placed = []; pocket = [];
    LOCS[startLoc].carried.forEach(id => addItem(id));
    timeLeft = PACK_SECONDS;
    finishPacking(false);
    startScene(0);
    return;
  }
  // 지하철처럼 이미 들고 있던 물건이 있으면 먼저 가방에 넣어 둠
  if (LOCS[startLoc].carried && !placed.length && !pocket.length) LOCS[startLoc].carried.forEach(id => addItem(id));
  timeLeft = PACK_SECONDS;
  stopTimer();
  renderPack("");
  window.scrollTo(0, 0);
  // 3·2·1 뒤에 시간이 흐르기 시작함 (그동안 화면을 한 번 훑어볼 수 있음)
  const ov = document.createElement("div");
  ov.className = "count-ov"; ov.id = "count-ov";
  document.body.appendChild(ov);
  let n = 3;
  const show = () => { ov.innerHTML = `<span>${n}</span><small>물건을 골라 가방에 담으세요</small>`; Sound.beep(0.5, 660); };
  show();
  packCountId = setInterval(() => {
    n -= 1;
    if (n > 0) { show(); return; }
    clearInterval(packCountId); packCountId = null; ov.remove();
    Sound.beep(0.8, 990);
    runPackTimer();
  }, 800);
}
let packCountId = null, packTickAt = 0;
function runPackTimer() {
  packTickAt = performance.now();
  const bar = document.querySelector(".tbar");
  if (bar) bar.classList.remove("hold");
  timerId = setInterval(() => {
    timeLeft -= 1; packTickAt = performance.now();
    const el = document.getElementById("timer");
    if (el) { el.textContent = timeLeft; el.classList.toggle("hurry", timeLeft <= 10); }
    // 마지막 10초 째깍 소리: 작게 시작해서 0에 가까울수록 크게, 끝 3초는 높은 음
    if (timeLeft > 0 && timeLeft <= 10) Sound.beep(0.25 + (10 - timeLeft) * 0.14, timeLeft <= 3 ? 1175 : 880);
    if (timeLeft <= 0) finishPacking(true);
  }, 1000);
}
// 시간 막대: 초록 → 노랑 → 빨강으로 줄어듦. 화면을 다시 그려도 이어지게 지난 시간만큼 앞당겨 시작
function packBarHtml() {
  const gone = timerId ? PACK_SECONDS - timeLeft + Math.min(1, (performance.now() - packTickAt) / 1000) : 0;
  return `<div class="tbar${timerId ? "" : " hold"}"><i style="animation-duration:${PACK_SECONDS}s;animation-delay:-${gone.toFixed(2)}s"></i></div>`;
}
function stopTimer() {
  if (timerId) { clearInterval(timerId); timerId = null; }
  if (packCountId) { clearInterval(packCountId); packCountId = null; }
  const ov = document.getElementById("count-ov"); if (ov) ov.remove();
}

function canPlace(x, y, w, h, ignoreId) {
  if (x < 0 || y < 0 || x + w > BAG_COLS || y + h > BAG_ROWS) return false;
  return placed.every(p => p.id === ignoreId || x + w <= p.x || p.x + p.w <= x || y + h <= p.y || p.y + p.h <= y);
}
function findSpot(w, h, ignoreId) {
  for (let y = 0; y < BAG_ROWS; y++) for (let x = 0; x < BAG_COLS; x++) {
    if (canPlace(x, y, w, h, ignoreId)) return { x, y };
  }
  return null;
}
function addItem(id) {
  const item = ITEM_BY_ID[id];
  if (bagKg() + item.kg > MAX_KG) return `${nameOf(id)}: 가방끈이 버티지 못해요 (최대 ${MAX_KG}kg).`;
  // 작은 물건은 앞주머니에 먼저. 앞주머니가 꽉 차면 가방 본칸 1칸에 넣음
  if (item.small && pocket.length < POCKET_SLOTS) { pocket.push(id); return ""; }
  let w = item.w || 1, h = item.h || 1, spot = findSpot(w, h);
  if (!spot) { w = item.h || 1; h = item.w || 1; spot = findSpot(w, h); }
  if (!spot) return `${nameOf(id)}: 자리가 없어요. 다른 걸 빼거나 회전해서 공간을 만들어 보세요.`;
  placed.push({ id, x: spot.x, y: spot.y, w, h });
  return "";
}
// 묶음에서 낱개를 몇 개 꺼냈는지 / 낱개 n개 넣기
const unitsTaken = b => unitCopies(b.bundle.unit, b.bundle.count).filter(has).length;
function addUnits(bundleId, n) {
  const b = ITEM_BY_ID[bundleId];
  const free = unitCopies(b.bundle.unit, b.bundle.count).filter(id => !has(id));
  if (!free.length) return `${b.name}: 남은 게 없어요.`;
  let added = 0, msg = "";
  for (const id of free.slice(0, n)) { msg = addItem(id); if (msg) break; added++; }
  if (!msg) return "";
  return added ? `${added}개만 넣었어요. ${msg}` : msg;
}
function rotateItem(id) {
  const p = placed.find(q => q.id === id);
  if (!p) return "";
  const w = p.h, h = p.w;
  if (canPlace(p.x, p.y, w, h, id)) { p.w = w; p.h = h; return ""; }
  const spot = findSpot(w, h, id);
  if (spot) { Object.assign(p, { x: spot.x, y: spot.y, w, h }); return ""; }
  return "회전할 자리가 없어요.";
}

// 끌어서 옮기기: 손가락 위치 → 가방 칸 좌표
function cellFromPoint(clientX, clientY) {
  const r = document.querySelector(".bag.edit").getBoundingClientRect();
  return { x: Math.floor((clientX - r.left) / (r.width / BAG_COLS)), y: Math.floor((clientY - r.top) / (r.height / BAG_ROWS)) };
}
function clearPreview() { document.querySelectorAll(".pv-ok, .pv-no").forEach(c => c.classList.remove("pv-ok", "pv-no")); }
function dragTarget(e) {
  const c = cellFromPoint(e.clientX, e.clientY);
  return { x: c.x - drag.offX, y: c.y - drag.offY };
}
// 누르는 순간부터 화면 전체(window)에서 손가락을 따라감 → 버튼 밖으로 나가도 끊기지 않음
function onDragStart(e) {
  if (e.button > 0) return;                 // 마우스 오른쪽 버튼 무시
  e.preventDefault();                       // 글자 선택·길게 누르기 메뉴 방지
  if (drag) { stopDrag(); clearPreview(); document.querySelectorAll(".dragging").forEach(x => x.classList.remove("dragging")); }   // 복사본 그림이 화면에 남지 않게
  bundlePick = null;                        // 묶음 선택창이 열린 채 가방을 만지면 닫음 (뒤따르는 click이 안내 글을 지우지 않게)
  const btn = e.currentTarget, id = btn.dataset.rot, p = placed.find(q => q.id === id);
  const c = cellFromPoint(e.clientX, e.clientY), r = btn.getBoundingClientRect();
  drag = { id, btn, startX: e.clientX, startY: e.clientY, offX: c.x - p.x, offY: c.y - p.y,
           grabX: e.clientX - r.left, grabY: e.clientY - r.top, w: r.width, h: r.height, moving: false, ghost: null, pid: e.pointerId };
  window.addEventListener("pointermove", onDragMove);
  window.addEventListener("pointerup", onDragEnd);
  window.addEventListener("pointercancel", onDragCancel);
}
function stopDrag() {
  window.removeEventListener("pointermove", onDragMove);
  window.removeEventListener("pointerup", onDragEnd);
  window.removeEventListener("pointercancel", onDragCancel);
  if (drag && drag.ghost) drag.ghost.remove();
  const d = drag; drag = null;
  return d;
}
function onDragCancel(e) {
  if (drag && e && e.pointerId != null && e.pointerId !== drag.pid) return;   // 다른 손가락이 취소된 건 무시
  stopDrag();
  if (timerId) rerender(() => renderPack(""));
}
function onDragMove(e) {
  if (!drag || (e.pointerId != null && e.pointerId !== drag.pid)) return;   // 끌고 있는 그 손가락만 따라감
  if (!timerId) { stopDrag(); return; }   // 가방 싸기가 끝났으면 무시
  if (!drag.moving) {
    if (Math.hypot(e.clientX - drag.startX, e.clientY - drag.startY) < 6) return;
    drag.moving = true;
    drag.btn.parentElement.classList.add("dragging");
    // 손가락을 따라다니는 복사본
    const g = drag.btn.cloneNode(true);
    g.removeAttribute("id");
    g.classList.add("drag-ghost");
    g.style.width = drag.w + "px"; g.style.height = drag.h + "px";
    document.body.appendChild(g);
    drag.ghost = g;
  }
  drag.ghost.style.left = (e.clientX - drag.grabX) + "px";
  drag.ghost.style.top = (e.clientY - drag.grabY) + "px";
  const p = placed.find(q => q.id === drag.id);
  if (!p) { stopDrag(); clearPreview(); return; }   // 끄는 도중 다른 손가락으로 그 물건을 뺀 경우
  const t = dragTarget(e);
  const ok = canPlace(t.x, t.y, p.w, p.h, p.id);
  clearPreview();
  for (let dy = 0; dy < p.h; dy++) for (let dx = 0; dx < p.w; dx++) {
    const cell = document.getElementById(`cell-${t.x + dx}-${t.y + dy}`);
    if (cell) cell.classList.add(ok ? "pv-ok" : "pv-no");
  }
}
function onDragEnd(e) {
  if (!drag || (e.pointerId != null && e.pointerId !== drag.pid)) return;   // 끌고 있는 그 손가락만 따라감
  if (!timerId) { stopDrag(); return; }   // 가방 싸기가 끝났으면 무시
  const t = dragTarget(e);            // 놓은 위치 (drag가 지워지기 전에 계산)
  const d = stopDrag();
  if (!d.moving) {                    // 그냥 누른 것 → 회전
    const m = rotateItem(d.id);
    rerender(() => renderPack(m));
    return;
  }
  const p = placed.find(q => q.id === d.id);
  if (!p) { rerender(() => renderPack("")); return; }
  const ok = canPlace(t.x, t.y, p.w, p.h, p.id);
  if (ok) { p.x = t.x; p.y = t.y; }
  rerender(() => renderPack(ok ? "" : "거기엔 안 들어가요."));
}

// 한 칸짜리 물건·앞주머니에 적는 짧은 이름
const SHORT_NAME = {"battery":"배터리","game":"게임기","lighter":"라이터","whistle":"호루라기","food":"비상식량","digestive":"쿠키","tuna1":"참치캔","rice1":"즉석밥","ramen1":"봉지라면","bottle2l":"생수 2L","vitamin":"영양제","tylenol":"타이레놀","cash":"현금","id":"신분증","passport":"여권","jewelry":"금반지","light":"손전등","stick":"등산스틱","raincoat":"우비","memo":"연락 메모","carkey":"차 키","mask":"마스크","tissue1":"휴지","toothset":"칫솔치약","wetwipe":"물티슈","sanitizer":"손소독제","umbrella":"장우산","diary":"다이어리","lipstick":"립스틱","rationwater":"생수","book":"책","pillpouch":"약 파우치","keylight":"키링 전등","earphones":"이어폰","hanky":"손수건","energybar":"에너지바","candy":"사탕","coffeemix":"커피 스틱","papercup":"종이컵","cbrmask":"방독면","spare_batt":"건전지","tape":"테이프","gloves":"고무장갑","cupramen1":"컵라면","smallbottle":"생수","bottle":"생수 2병"};
const shortName = it => it.name;   // 물건 이름 자체를 간단하게 바꿔서 이제 줄임 이름은 안 씀 (SHORT_NAME은 옛 기록)
function pocketHtml(mode, list = pocket) {
  let slots = "";
  for (let i = 0; i < POCKET_SLOTS; i++) {
    const id = list[i];
    if (!id) { slots += `<div class="pslot"></div>`; continue; }
    const it = ITEM_BY_ID[id];
    if (mode === "edit") slots += `<div class="pslot"><button class="rot" title="${it.name}" aria-label="${it.name}">${it.emo}<span class="nm">${shortName(it)}</span></button><button class="del" id="pdel-${id}" data-pdel="${id}" aria-label="${it.name} 빼기">✕</button></div>`;
    else if (mode === "use") slots += `<div class="pslot"><button class="rot${pendingUse === id ? " armed" : ""}" id="use-${id}" data-use="${id}" title="${it.name}" aria-label="${it.name} 꺼내 쓰기">${it.emo}<span class="nm">${shortName(it)}</span></button></div>`;
    else slots += `<div class="pslot"><div class="rot" title="${it.name}">${it.emo}<span class="nm">${shortName(it)}</span></div></div>`;
  }
  return `<div class="pocket" style="grid-template-columns:auto repeat(${POCKET_SLOTS},1fr)"><span class="plabel">앞<br>주머니</span>${slots}</div>`;
}

// mode: "edit"(가방 싸기) | "use"(상황에서 꺼내 쓰기) | "view"(보기만)
// 이모지가 같은 물건(💊 영양제·타이레놀 등)은 한 칸짜리여도 이름을 남김
const SHARED_EMO = (() => { const c = {}; Object.values(ITEM_BY_ID).forEach(it => { c[it.emo] = (c[it.emo] || 0) + 1; }); return new Set(Object.keys(c).filter(e => c[e] > 1)); })();
function bagHtml(mode, list = placed, pk = pocket) {
  let cells = "";
  for (let y = 0; y < BAG_ROWS; y++) for (let x = 0; x < BAG_COLS; x++) {
    cells += `<div class="cell"${mode === "edit" ? ` id="cell-${x}-${y}"` : ""} style="grid-column:${x + 1};grid-row:${y + 1}"></div>`;
  }
  const items = list.map(p => {
    const item = ITEM_BY_ID[p.id];
    const style = `grid-column:${p.x + 1} / span ${p.w};grid-row:${p.y + 1} / span ${p.h}`;
    const label = item.perCell && uses[p.id] ? item.name.replace(/\d+병/, uses[p.id] + "병") : item.name;
    const wide = p.w >= 2;
    const nmText = label;   // 가로·세로 상관없이 같은 이름
    const hasUses = mode === "use" && item.uses && !item.perCell;
    const inlineUses = hasUses && p.w === 1 && p.h === 1;   // 한 칸짜리는 구석 숫자가 이름과 겹쳐서 이름 옆에 적음
    const nmFull = nmText + (inlineUses ? ` ×${uses[p.id]}` : "");
    // 한 칸 폭에 이름 맞추기: 띄어쓰기가 있으면 두 줄(낱말 단위), 네 글자 이상이면 조금 작게 한 줄
    const nmCls = wide ? " wide" : /\s/.test(nmFull) ? " two" : nmFull.length >= 4 ? " n4" : "";
    // 한 칸짜리는 이름 글자가 너무 작아서 아이콘만 크게 (이름은 aria-label·title). 남은 개수는 구석에
    const solo = p.w === 1 && p.h === 1 && !SHARED_EMO.has(item.emo), row = p.w >= 2 && p.h === 1;   // 가로로 긴 한 줄짜리는 아이콘 왼쪽·이름 오른쪽
    const inner = solo ? `<span class="emo">${item.emo}</span>` : `<span class="emo">${item.emo}</span><span class="nm${nmCls}">${nmFull}</span>`;
    const usesTag = hasUses && (solo || !inlineUses) ? `<span class="uses">×${uses[p.id]}</span>` : solo && item.perCell && uses[p.id] > 1 ? `<span class="uses">×${uses[p.id]}</span>` : "";
    if (mode === "view") return `<div class="placed${solo ? " solo" : row ? " row" : ""}" title="${label}" style="${style}"><div class="rot">${inner}</div></div>`;
    if (mode === "use") return `<div class="placed${solo ? " solo" : row ? " row" : ""}" title="${label}" style="${style}"><button class="rot${pendingUse === p.id ? " armed" : ""}" id="use-${p.id}" data-use="${p.id}" aria-label="${item.name} 꺼내 쓰기">${inner}</button>${usesTag}</div>`;
    return `<div class="placed${solo ? " solo" : row ? " row" : ""}" title="${label}" style="${style}">
      <button class="rot" id="rot-${p.id}" data-rot="${p.id}" aria-label="${item.name} 회전">${inner}</button>
      <button class="del" id="del-${p.id}" data-del="${p.id}" aria-label="${item.name} 빼기">✕</button>
    </div>`;
  }).join("");
  const gridStyle = `grid-template-columns:repeat(${BAG_COLS},1fr);grid-template-rows:repeat(${BAG_ROWS},1fr);aspect-ratio:${BAG_COLS}/${BAG_ROWS}`;
  return `<div class="bag ${mode}" style="${gridStyle}">${cells}${items}</div>${pocketHtml(mode, pk)}`;
}

// 묶음 카드: 다른 물건과 같은 크기. 누르면 그 자리에서 '+1개 / 전부' 두 버튼으로 바뀜 (크기는 그대로라 화면이 안 밀림)
function bundleCardHtml(b) {
  const u = ITEM_BY_ID[b.bundle.unit], taken = unitsTaken(b), left = b.bundle.count - taken, whole = has(b.id);
  const off = whole || left <= 0;
  if (bundlePick && bundlePick.id === b.id && !off) {
    return `<div class="item-card bundle-card pick" id="item-${b.id}">
        <button type="button" class="bb-unit" data-bunit="${b.id}" aria-label="${u.name} 낱개 하나 넣기">${u.emo} +1개<small>${left}개 남음</small></button>
        <button type="button" class="bb-whole" data-bwhole="${b.id}" aria-label="${b.name} 전부 넣기" ${taken ? "disabled" : ""}>📦 전부<small>${b.w}×${b.h}칸</small></button>
      </div>`;
  }
  const status = whole ? "✓ 전부 넣음" : taken ? `${taken}개 넣음 · ${left}개 남음` : `묶음 · ${b.w}×${b.h}칸 · ${b.kg}kg`;
  return `<button class="item-card" id="item-${b.id}" data-bundle="${b.id}" ${off ? "disabled" : ""}>
      <span class="emo">${b.emo}</span>
      <span style="min-width:0"><span class="name">${b.name}</span><span class="size">${status}</span></span>
    </button>`;
}
// 누른 곳 옆에 잠깐 떠오르는 숫자 (예: +1 💧)
function floatPlus(e, text) {
  const r = e.currentTarget && e.currentTarget.getBoundingClientRect ? e.currentTarget.getBoundingClientRect() : null;
  const x = e.clientX || (r ? r.left + r.width / 2 : innerWidth / 2), y = e.clientY || (r ? r.top : innerHeight / 2);
  const el = document.createElement("div");
  el.className = "float-plus"; el.textContent = text;
  el.style.left = x + "px"; el.style.top = y + "px";
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 900);
}

function butterflyCheck(s) {
  const out = [];
  for (const b of BUTTERFLY) {
    if (flags["bfDone_" + b.key] || !b.when(s)) continue;
    flags["bfDone_" + b.key] = true;
    if (b.key === "phone") {   // 보조배터리가 있으면 괜찮음
      if (has("battery")) { out.push({ up: true, img: b.img, text: "📵 전화를 계속 걸어 배터리가 바닥났지만, 보조배터리로 충전해 둬서 재난문자를 바로 확인했다." }); continue; }
      hp = clampHp(hp - 3);
      out.push({ up: false, img: b.img, text: "📵 전화를 계속 걸다 배터리가 다 나가서, 재난문자를 옆 사람 휴대폰으로 겨우 봤다. ❤️ −3" });
      continue;
    }
    if (b.hp) hp = clampHp(hp + b.hp);
    if (b.coop) traits.coop += b.coop;
    if (b.info) traits.info = (traits.info || 0) + b.info;
    if (b.gain && !addItem(b.gain) && ITEM_BY_ID[b.gain].uses) uses[b.gain] = ITEM_BY_ID[b.gain].uses;
    out.push({ up: (b.hp || 0) >= 0 && !b.coop && !b.down, img: b.img, text: ((b.alt && b.alt(s)) || b.text) + (b.hp ? ` ❤️ ${b.hp > 0 ? "+" : "−"}${Math.abs(b.hp)}` : "") });
  }
  if (!out.length) return null;
  return { up: out.every(n => n.up), img: (out.find(n => n.img) || {}).img, text: out.map(n => n.text).join("<br>") };
}
